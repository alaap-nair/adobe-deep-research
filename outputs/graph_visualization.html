"to": "ent:gene_for_herbicide_resistance"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "perform", "title": "\u003cb\u003eperform\u003c/b\u003e\u003cbr\u003e\u003ci\u003eScientists perform RNA analysis to study gene expression patterns in cells.\u003c/i\u003e", "to": "ent:rna_analysis"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "use", "title": "\u003cb\u003euse\u003c/b\u003e\u003cbr\u003e\u003ci\u003ePolymerase chain reaction (PCR) is a technique that scientists use to amplify specific DNA regions for further analysis.\u003c/i\u003e", "to": "ent:polymerase_chain_reaction"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "probe", "title": "\u003cb\u003eprobe\u003c/b\u003e\u003cbr\u003e\u003ci\u003eScientists can probe nucleic acid samples, such as fragmented genomic DNA and RNA extracts, for the presence of certain sequences.\u003c/i\u003e", "to": "ent:nucleic_acid_samples"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "label", "title": "\u003cb\u003elabel\u003c/b\u003e\u003cbr\u003e\u003ci\u003eScientists design and label short DNA fragments, or probes with radioactive or fluorescent dyes to aid detection.\u003c/i\u003e", "to": "ent:short_dna_fragments"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "transfer", "title": "\u003cb\u003etransfer\u003c/b\u003e\u003cbr\u003e\u003ci\u003eScientists then transfer the fragments in the gel onto a nylon membrane in a procedure we call blotting (Figure 17.6).\u003c/i\u003e", "to": "ent:fragments_in_the_gel"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "probe", "title": "\u003cb\u003eprobe\u003c/b\u003e\u003cbr\u003e\u003ci\u003eScientists can then probe the nucleic acid fragments that are bound to the membrane\u0027s surface with specific radioactively or fluorescently labeled probe sequences.\u003c/i\u003e", "to": "ent:nucleic_acid_fragments"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "use", "title": "\u003cb\u003euse\u003c/b\u003e\u003cbr\u003e\u003ci\u003eScientists use Southern blots to detect the presence of certain DNA sequences in a given genome, and Northern blots to detect gene expression.\u003c/i\u003e", "to": "ent:southern_blots"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "use", "title": "\u003cb\u003euse\u003c/b\u003e\u003cbr\u003e\u003ci\u003eScientists use Southern blots to detect the presence of certain DNA sequences in a given genome, and Northern blots to detect gene expression.\u003c/i\u003e", "to": "ent:northern_blots"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "use", "title": "\u003cb\u003euse\u003c/b\u003e\u003cbr\u003e\u003ci\u003eScientists use Southern blotting to find a particular sequence in a DNA sample.\u003c/i\u003e", "to": "ent:southern_blotting"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "incubate", "title": "\u003cb\u003eincubate\u003c/b\u003e\u003cbr\u003e\u003ci\u003eScientists separate DNA fragments on a gel, transfer them to a nylon membrane, and incubate them with a DNA probe complementary to the sequence of interest.\u003c/i\u003e", "to": "ent:dna_fragments"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "run", "title": "\u003cb\u003erun\u003c/b\u003e\u003cbr\u003e\u003ci\u003eNorthern blotting is similar to Southern blotting, but scientists run RNA on the gel instead of DNA.\u003c/i\u003e", "to": "ent:rna"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "detect", "title": "\u003cb\u003edetect\u003c/b\u003e\u003cbr\u003e\u003ci\u003eIn Western blotting, scientists run proteins on a gel and detect them using antibodies.\u003c/i\u003e", "to": "ent:proteins"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "use", "title": "\u003cb\u003euse\u003c/b\u003e\u003cbr\u003e\u003ci\u003eIn cloning, scientists can use the plasmid molecules to provide a \u201cfolder\u201d in which to insert a desired DNA fragment.\u003c/i\u003e", "to": "ent:plasmid_molecules"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "engineer", "title": "\u003cb\u003eengineer\u003c/b\u003e\u003cbr\u003e\u003ci\u003eScientists have repurposed and engineered plasmids as vectors for molecular cloning and the large-scale production of important reagents, such as insulin and human growth hormone.\u003c/i\u003e", "to": "ent:plasmids"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "call", "title": "\u003cb\u003ecall\u003c/b\u003e\u003cbr\u003e\u003ci\u003eIn the bacterial context, scientists call the DNA fragment from the human genome (or the genome of another studied organism) foreign DNA, or a transgene, to differentiate it from the bacterium\u0027s DNA, or the host DNA.\u003c/i\u003e", "to": "ent:dna_fragment_from_the_human_genome"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "add", "title": "\u003cb\u003eadd\u003c/b\u003e\u003cbr\u003e\u003ci\u003eAdding the enzyme DNA ligase permanently joins the DNA fragments via phosphodiester bonds.\u003c/i\u003e", "to": "ent:dna_ligase"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "have cloned", "title": "\u003cb\u003ehave cloned\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSince Dolly, scientists have cloned successfully several animals such as horses, bulls, and goats, although these animals often exhibit facial, limb, and cardiac abnormalities.\u003c/i\u003e", "to": "ent:horses,_bulls,_and_goats"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "genetically modified", "title": "\u003cb\u003egenetically modified\u003c/b\u003e\u003cbr\u003e\u003ci\u003eScientists have genetically modified bacteria, plants, and animals since the early 1970s for academic, medical, agricultural, and industrial purposes.\u003c/i\u003e", "to": "ent:bacteria,_plants,_and_animals"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "used", "title": "\u003cb\u003eused\u003c/b\u003e\u003cbr\u003e\u003ci\u003eScientists used recombinant DNA technology to produce large-scale quantities of human insulin in E. coli as early as 1978.\u003c/i\u003e", "to": "ent:recombinant_dna_technology"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "used", "title": "\u003cb\u003eused\u003c/b\u003e\u003cbr\u003e\u003ci\u003eScientists have used mice extensively for expressing and studying recombinant gene and mutation effects.\u003c/i\u003e", "to": "ent:mice"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "genetically engineered", "title": "\u003cb\u003egenetically engineered\u003c/b\u003e\u003cbr\u003e\u003ci\u003eStaples like corn, potatoes, and tomatoes were the first crop plants that scientists genetically engineered.\u003c/i\u003e", "to": "ent:corn,_potatoes,_and_tomatoes"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "cloned toxin genes", "title": "\u003cb\u003ecloned toxin genes\u003c/b\u003e\u003cbr\u003e\u003ci\u003eScientists have cloned the crystal toxin genes from Bt and introduced them into plants.\u003c/i\u003e", "to": "ent:from_bt"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "used antisense RNA technology", "title": "\u003cb\u003eused antisense RNA technology\u003c/b\u003e\u003cbr\u003e\u003ci\u003eScientists used antisense RNA technology to slow the softening and rotting process caused by fungal infections, which led to increased shelf life of the GM tomatoes.\u003c/i\u003e", "to": "ent:slow_softening_and_rotting_process"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "used", "title": "\u003cb\u003eused\u003c/b\u003e\u003cbr\u003e\u003ci\u003eScientists used the term linkage before the discovery of DNA.\u003c/i\u003e", "to": "ent:the_term_linkage"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "use", "title": "\u003cb\u003euse\u003c/b\u003e\u003cbr\u003e\u003ci\u003eScientists now use more sophisticated markers, including those based on non-coding DNA, to compare individuals\u2019 genomes in a population.\u003c/i\u003e", "to": "ent:more_sophisticated_markers"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "use in generating genetic maps", "title": "\u003cb\u003euse in generating genetic maps\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSome genetic markers that scientists use in generating genetic maps are restriction fragment length polymorphisms (RFLP), variable number of tandem repeats (VNTRs), microsatellite polymorphisms, and the single nucleotide polymorphisms (SNPs).\u003c/i\u003e", "to": "ent:restriction_fragment_length_polymorphisms_(rflp)"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "use in generating genetic maps", "title": "\u003cb\u003euse in generating genetic maps\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSome genetic markers that scientists use in generating genetic maps are restriction fragment length polymorphisms (RFLP), variable number of tandem repeats (VNTRs), microsatellite polymorphisms, and the single nucleotide polymorphisms (SNPs).\u003c/i\u003e", "to": "ent:variable_number_of_tandem_repeats_(vntrs)"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "use in generating genetic maps", "title": "\u003cb\u003euse in generating genetic maps\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSome genetic markers that scientists use in generating genetic maps are restriction fragment length polymorphisms (RFLP), variable number of tandem repeats (VNTRs), microsatellite polymorphisms, and the single nucleotide polymorphisms (SNPs).\u003c/i\u003e", "to": "ent:microsatellite_polymorphisms"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "use in generating genetic maps", "title": "\u003cb\u003euse in generating genetic maps\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSome genetic markers that scientists use in generating genetic maps are restriction fragment length polymorphisms (RFLP), variable number of tandem repeats (VNTRs), microsatellite polymorphisms, and the single nucleotide polymorphisms (SNPs).\u003c/i\u003e", "to": "ent:single_nucleotide_polymorphisms_(snps)"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "refer to", "title": "\u003cb\u003erefer to\u003c/b\u003e\u003cbr\u003e\u003ci\u003eScientists sometimes refer to this as an individual\u2019s DNA \u201cfingerprint.\u201d\u003c/i\u003e", "to": "ent:individual\u2019s_dna_\u201cfingerprint\u201d"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "use", "title": "\u003cb\u003euse\u003c/b\u003e\u003cbr\u003e\u003ci\u003eScientists use information from each technique in combination to study the genome.\u003c/i\u003e", "to": "ent:information_from_each_technique"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "use", "title": "\u003cb\u003euse\u003c/b\u003e\u003cbr\u003e\u003ci\u003eScientists are using genomic mapping with different model organisms for research.\u003c/i\u003e", "to": "ent:genomic_mapping_with_different_model_organisms"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "analyze", "title": "\u003cb\u003eanalyze\u003c/b\u003e\u003cbr\u003e\u003ci\u003eAll of the segments sequence using the chain-sequencing method. Then, with sequence computer assistance, scientists can analyze the fragments to see where their sequences overlap.\u003c/i\u003e", "to": "ent:the_fragments"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "reform", "title": "\u003cb\u003ereform\u003c/b\u003e\u003cbr\u003e\u003ci\u003eBy matching overlapping sequences at each fragment\u2019s end, scientists can reform the entire DNA sequence.\u003c/i\u003e", "to": "ent:the_entire_dna_sequence"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "used", "title": "\u003cb\u003eused\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe scientists used databases and several publications to analyze the genomic data.\u003c/i\u003e", "to": "ent:databases_and_several_publications"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "use mitochondrial DNA to study", "title": "\u003cb\u003euse mitochondrial DNA to study\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMitochondrial DNA mutates at a rapid rate and scientists often use it to study evolutionary relationships.\u003c/i\u003e", "to": "ent:evolutionary_relationships"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "use mitochondrial genomics to trace", "title": "\u003cb\u003euse mitochondrial genomics to trace\u003c/b\u003e\u003cbr\u003e\u003ci\u003eFor this reason, scientists often use mitochondrial genomics to trace genealogy.\u003c/i\u003e", "to": "ent:genealogy"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "use genomic data to identify", "title": "\u003cb\u003euse genomic data to identify\u003c/b\u003e\u003cbr\u003e\u003ci\u003eScientists use genomic data to identify desirable traits, and then transfer those traits to a different organism.\u003c/i\u003e", "to": "ent:desirable_traits"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "use", "title": "\u003cb\u003euse\u003c/b\u003e\u003cbr\u003e\u003ci\u003eScientists have also used protein microarrays to study protein interactions.\u003c/i\u003e", "to": "ent:protein_microarrays"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "use", "title": "\u003cb\u003euse\u003c/b\u003e\u003cbr\u003e\u003ci\u003eScientists use computer software to analyze the vast amount of data for proteomic analysis.\u003c/i\u003e", "to": "ent:computer_software"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "use", "title": "\u003cb\u003euse\u003c/b\u003e\u003cbr\u003e\u003ci\u003eScientists use two-hybrid screening to determine whether two proteins interact.\u003c/i\u003e", "to": "ent:two-hybrid_screening"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "are challenged by", "title": "\u003cb\u003eare challenged by\u003c/b\u003e\u003cbr\u003e\u003ci\u003eScientists are challenged when implementing proteomic analysis because it is difficult to detect small protein quantities.\u003c/i\u003e", "to": "ent:proteomic_analysis"}, {"arrows": "to", "color": "#888888", "from": "ent:scientists", "label": "create", "title": "\u003cb\u003ecreate\u003c/b\u003e\u003cbr\u003e\u003ci\u003eScientists usually create transgenic plants to improve crop plant characteristics.\u003c/i\u003e", "to": "ent:transgenic_plants"}, {"arrows": "to", "color": "#888888", "from": "ent:screening", "label": "does not reduce", "title": "\u003cb\u003edoes not reduce\u003c/b\u003e\u003cbr\u003e\u003ci\u003eTheir recommendation is based on evidence that screening does not reduce the risk of death from prostate cancer.\u003c/i\u003e", "to": "ent:the_risk_of_death_from_prostate_cancer"}, {"arrows": "to", "color": "#888888", "from": "ent:second_sheep", "label": "introduced nucleus from", "title": "\u003cb\u003eintroduced nucleus from\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThey then introduced the nucleus from a second sheep into the cell, which divided to the blastocyst stage before they implanted it in a surrogate mother.\u003c/i\u003e", "to": "ent:donor_egg_cell"}, {"arrows": "to", "color": "#888888", "from": "ent:sequence_alignment", "label": "is an arrangement of", "title": "\u003cb\u003eis an arrangement of\u003c/b\u003e\u003cbr\u003e\u003ci\u003eA sequence alignment is an arrangement of proteins, DNA, or RNA.\u003c/i\u003e", "to": "ent:proteins,_dna,_or_rna"}, {"arrows": "to", "color": "#888888", "from": "ent:sequence_alignment", "label": "used to identify", "title": "\u003cb\u003eused to identify\u003c/b\u003e\u003cbr\u003e\u003ci\u003eScientists use it to identify similar regions between cell types or species, which may indicate function or structure conservation.\u003c/i\u003e", "to": "ent:similar_regions_between_cell_types_or_species"}, {"arrows": "to", "color": "#888888", "from": "ent:sequence_alignment", "label": "used to construct", "title": "\u003cb\u003eused to construct\u003c/b\u003e\u003cbr\u003e\u003ci\u003eWe can use sequence alignments to construct phylogenetic trees.\u003c/i\u003e", "to": "ent:phylogenetic_trees"}, {"arrows": "to", "color": "#888888", "from": "ent:sequence_mapping", "label": "resulted from", "title": "\u003cb\u003eresulted from\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSequence mapping resulted from DNA sequencing technology that allowed for creating detailed physical maps with distances measured in terms of the number of base pairs.\u003c/i\u003e", "to": "ent:dna_sequencing_technology"}, {"arrows": "to", "color": "#888888", "from": "ent:sequence_mapping", "label": "obtained after", "title": "\u003cb\u003eobtained after\u003c/b\u003e\u003cbr\u003e\u003ci\u003esequence mapping mapping information obtained after DNA sequencing\u003c/i\u003e", "to": "ent:dna_sequencing"}, {"arrows": "to", "color": "#888888", "from": "ent:sequence-tagged_site", "label": "is a", "title": "\u003cb\u003eis a\u003c/b\u003e\u003cbr\u003e\u003ci\u003eA genetic site that scientists use to generate a physical map with sequencing technology (a sequence-tagged site, or STS) is a unique sequence in the genome with a known exact chromosomal location.\u003c/i\u003e", "to": "ent:unique_sequence_in_the_genome"}, {"arrows": "to", "color": "#888888", "from": "ent:sequence-tagged_site", "label": "has", "title": "\u003cb\u003ehas\u003c/b\u003e\u003cbr\u003e\u003ci\u003eA genetic site that scientists use to generate a physical map with sequencing technology (a sequence-tagged site, or STS) is a unique sequence in the genome with a known exact chromosomal location.\u003c/i\u003e", "to": "ent:a_known_exact_chromosomal_location"}, {"arrows": "to", "color": "#888888", "from": "ent:sequencing_an_individual_person\u2019s_genome", "label": "is", "title": "\u003cb\u003eis\u003c/b\u003e\u003cbr\u003e\u003ci\u003eis currently possible\u003c/i\u003e", "to": "ent:currently_possible"}, {"arrows": "to", "color": "#888888", "from": "ent:sequencing_an_individual_person\u2019s_genome", "label": "could lead to", "title": "\u003cb\u003ecould lead to\u003c/b\u003e\u003cbr\u003e\u003ci\u003ecould lead to legal issues regarding discrimination and privacy\u003c/i\u003e", "to": "ent:legal_issues_regarding_discrimination_and_privacy"}, {"arrows": "to", "color": "#888888", "from": "ent:sequencing_an_individual_person\u2019s_genome", "label": "could help make", "title": "\u003cb\u003ecould help make\u003c/b\u003e\u003cbr\u003e\u003ci\u003ecould help make informed choices about medical treatment\u003c/i\u003e", "to": "ent:informed_choices_about_medical_treatment"}, {"arrows": "to", "color": "#888888", "from": "ent:set_of_proteins_with_altered_expression_levels", "label": "is", "title": "\u003cb\u003eis\u003c/b\u003e\u003cbr\u003e\u003ci\u003eAn individual protein is a biomarker; whereas, a set of proteins with altered expression levels is a protein signature.\u003c/i\u003e", "to": "ent:protein_signature"}, {"arrows": "to", "color": "#888888", "from": "ent:shotgun_sequencing", "label": "analyzed", "title": "\u003cb\u003eanalyzed\u003c/b\u003e\u003cbr\u003e\u003ci\u003eOriginally, shotgun sequencing only analyzed one end of each fragment for overlaps.\u003c/i\u003e", "to": "ent:one_end_of_each_fragment"}, {"arrows": "to", "color": "#888888", "from": "ent:shotgun_sequencing", "label": "sequences", "title": "\u003cb\u003esequences\u003c/b\u003e\u003cbr\u003e\u003ci\u003eshotgun sequencing method used to sequence multiple DNA fragments to generate the sequence of a large piece of DNA\u003c/i\u003e", "to": "ent:multiple_dna_fragments"}, {"arrows": "to", "color": "#888888", "from": "ent:shotgun_sequencing_method", "label": "cuts", "title": "\u003cb\u003ecuts\u003c/b\u003e\u003cbr\u003e\u003ci\u003eIn shotgun sequencing method, several DNA fragment copies cut randomly into many smaller pieces (somewhat like what happens to a round shot cartridge when fired from a shotgun).\u003c/i\u003e", "to": "ent:dna_fragment_copies"}, {"arrows": "to", "color": "#888888", "from": "ent:single_gene_defect", "label": "accounts for", "title": "\u003cb\u003eaccounts for\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSuch defects only account for approximately 5 percent of diseases in developed countries.\u003c/i\u003e", "to": "ent:approximately_5_percent_of_diseases_in_developed_countries"}, {"arrows": "to", "color": "#888888", "from": "ent:single_nucleotide_polymorphism_(snp)", "label": "is variation in", "title": "\u003cb\u003eis variation in\u003c/b\u003e\u003cbr\u003e\u003ci\u003esingle nucleotide polymorphism (SNP) variation between individuals in a single nucleotide\u003c/i\u003e", "to": "ent:single_nucleotide"}, {"arrows": "to", "color": "#888888", "from": "ent:single_sequence_length_polymorphism", "label": "is a", "title": "\u003cb\u003eis a\u003c/b\u003e\u003cbr\u003e\u003ci\u003eAn EST is a short STS that we can identify with cDNA libraries, while we obtain SSLPs from known genetic markers, which provide a link between genetic and physical maps.\u003c/i\u003e", "to": "ent:common_sts"}, {"arrows": "to", "color": "#888888", "from": "ent:single_sequence_length_polymorphism", "label": "provides a link between", "title": "\u003cb\u003eprovides a link between\u003c/b\u003e\u003cbr\u003e\u003ci\u003eAn EST is a short STS that we can identify with cDNA libraries, while we obtain SSLPs from known genetic markers, which provide a link between genetic and physical maps.\u003c/i\u003e", "to": "ent:genetic_and_physical_maps"}, {"arrows": "to", "color": "#888888", "from": "ent:smaller_molecules", "label": "move faster than", "title": "\u003cb\u003emove faster than\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSmaller molecules move through the gel\u0027s pores faster than larger molecules.\u003c/i\u003e", "to": "ent:larger_molecules"}, {"arrows": "to", "color": "#888888", "from": "ent:snps", "label": "are variations in", "title": "\u003cb\u003eare variations in\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSNPs are variations in a single nucleotide.\u003c/i\u003e", "to": "ent:a_single_nucleotide"}, {"arrows": "to", "color": "#888888", "from": "ent:somatic_cell_nuclear_transfer", "label": "is the technique of", "title": "\u003cb\u003eis the technique of\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSomatic cell nuclear transfer is the technique of transferring a diploid nucleus into an enucleated egg.\u003c/i\u003e", "to": "ent:transferring_a_diploid_nucleus"}, {"arrows": "to", "color": "#888888", "from": "ent:some_parts_of_the_genome", "label": "are", "title": "\u003cb\u003eare\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSome parts of the genome are recombination hotspots; whereas, others do not show a propensity for recombination.\u003c/i\u003e", "to": "ent:recombination_hotspots"}, {"arrows": "to", "color": "#888888", "from": "ent:southern_blots", "label": "detect", "title": "\u003cb\u003edetect\u003c/b\u003e\u003cbr\u003e\u003ci\u003eScientists use Southern blots to detect the presence of certain DNA sequences in a given genome, and Northern blots to detect gene expression.\u003c/i\u003e", "to": "ent:certain_dna_sequences"}, {"arrows": "to", "color": "#888888", "from": "ent:southern_blotting", "label": "transfer", "title": "\u003cb\u003etransfer\u003c/b\u003e\u003cbr\u003e\u003ci\u003eWhen scientists transfer DNA to a nylon membrane, they refer to the technique as Southern blotting.\u003c/i\u003e", "to": "ent:dna"}, {"arrows": "to", "color": "#888888", "from": "ent:southern_blotting", "label": "transfers", "title": "\u003cb\u003etransfers\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSouthern blotting DNA transfer from a gel to a nylon membrane\u003c/i\u003e", "to": "ent:dna_from_a_gel_to_a_nylon_membrane"}, {"arrows": "to", "color": "#888888", "from": "ent:stem_cells", "label": "help", "title": "\u003cb\u003ehelp\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThese cells help the skin repair itself, and their discovery may have applications in treatments of skin disease and potentially other conditions, such as nerve damage.\u003c/i\u003e", "to": "ent:skin_repair"}, {"arrows": "to", "color": "#888888", "from": "ent:systems_biology", "label": "studies", "title": "\u003cb\u003estudies\u003c/b\u003e\u003cbr\u003e\u003ci\u003esystems biology study of whole biological systems (genomes and proteomes) based on interactions within the system\u003c/i\u003e", "to": "ent:whole_biological_systems"}, {"arrows": "to", "color": "#888888", "from": "ent:taq_polymerase", "label": "is", "title": "\u003cb\u003eis\u003c/b\u003e\u003cbr\u003e\u003ci\u003eTaq polymerase is a DNA polymerase isolated from the thermostable bacterium Thermus aquaticus that is able to withstand the high temperatures that scientists use in PCR.\u003c/i\u003e", "to": "ent:a_dna_polymerase"}, {"arrows": "to", "color": "#888888", "from": "ent:taq_polymerase", "label": "isolated from", "title": "\u003cb\u003eisolated from\u003c/b\u003e\u003cbr\u003e\u003ci\u003eTaq polymerase is a DNA polymerase isolated from the thermostable bacterium Thermus aquaticus that is able to withstand the high temperatures that scientists use in PCR.\u003c/i\u003e", "to": "ent:thermus_aquaticus"}, {"arrows": "to", "color": "#888888", "from": "ent:taq_polymerase", "label": "withstand", "title": "\u003cb\u003ewithstand\u003c/b\u003e\u003cbr\u003e\u003ci\u003eTaq polymerase is a DNA polymerase isolated from the thermostable bacterium Thermus aquaticus that is able to withstand the high temperatures that scientists use in PCR.\u003c/i\u003e", "to": "ent:high_temperatures"}, {"arrows": "to", "color": "#888888", "from": "ent:technology", "label": "are in", "title": "\u003cb\u003eare in\u003c/b\u003e\u003cbr\u003e\u003ci\u003etechnology are in medicine (vaccine and antibiotic production) and agriculture (crop genetic modification in order to increase yields).\u003c/i\u003e", "to": "ent:medicine"}, {"arrows": "to", "color": "#888888", "from": "ent:technology", "label": "are in", "title": "\u003cb\u003eare in\u003c/b\u003e\u003cbr\u003e\u003ci\u003etechnology are in medicine (vaccine and antibiotic production) and agriculture (crop genetic modification in order to increase yields).\u003c/i\u003e", "to": "ent:agriculture"}, {"arrows": "to", "color": "#888888", "from": "ent:the_chain_termination_method", "label": "uses", "title": "\u003cb\u003euses\u003c/b\u003e\u003cbr\u003e\u003ci\u003euses labeled ddNTPs\u003c/i\u003e", "to": "ent:labeled_ddntps"}, {"arrows": "to", "color": "#888888", "from": "ent:therapeutic_cloning", "label": "produces", "title": "\u003cb\u003eproduces\u003c/b\u003e\u003cbr\u003e\u003ci\u003eTherapeutic cloning produces stem cells in the attempt to remedy detrimental diseases or defects (unlike reproductive cloning, which aims to reproduce an organism).\u003c/i\u003e", "to": "ent:stem_cells"}, {"arrows": "to", "color": "#888888", "from": "ent:thermus_aquaticus", "label": "grows in", "title": "\u003cb\u003egrows in\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThermus aquaticus grows in the Lower Geyser Basin of Yellowstone National Park.\u003c/i\u003e", "to": "ent:lower_geyser_basin_of_yellowstone_national_park"}, {"arrows": "to", "color": "#888888", "from": "ent:ti_plasmid", "label": "derived from", "title": "\u003cb\u003ederived from\u003c/b\u003e\u003cbr\u003e\u003ci\u003eTi plasmid plasmid system derived from Agrobacterium tumefaciens that scientists have used to introduce foreign DNA into plant cells\u003c/i\u003e", "to": "ent:agrobacterium_tumefaciens"}, {"arrows": "to", "color": "#888888", "from": "ent:ti_plasmids", "label": "carry genes", "title": "\u003cb\u003ecarry genes\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe Ti plasmids carry antibiotic resistance genes to aid selection and researchers can propagate them in E. coli cells as well.\u003c/i\u003e", "to": "ent:antibiotic_resistance_genes"}, {"arrows": "to", "color": "#888888", "from": "ent:traditional_vaccination_strategies", "label": "use", "title": "\u003cb\u003euse\u003c/b\u003e\u003cbr\u003e\u003ci\u003eTraditional vaccination strategies use weakened or inactive forms of microorganisms to mount the initial immune response.\u003c/i\u003e", "to": "ent:weakened_or_inactive_forms_of_microorganisms"}, {"arrows": "to", "color": "#888888", "from": "ent:transcription", "label": "occurs", "title": "\u003cb\u003eoccurs\u003c/b\u003e\u003cbr\u003e\u003ci\u003eTranscription occurs only if the prey \u201ccatches\u201d the bait.\u003c/i\u003e", "to": "ent:prey_catches_bait"}, {"arrows": "to", "color": "#888888", "from": "ent:transcription_factor", "label": "splits into", "title": "\u003cb\u003esplits into\u003c/b\u003e\u003cbr\u003e\u003ci\u003ea transcription factor splits into a DNA-binding domain (BD) and an activator domain (AD).\u003c/i\u003e", "to": "ent:dna-binding_domain_and_activator_domain"}, {"arrows": "to", "color": "#888888", "from": "ent:transgenic_organism", "label": "receives", "title": "\u003cb\u003ereceives\u003c/b\u003e\u003cbr\u003e\u003ci\u003etransgenic organism that receives DNA from a different species\u003c/i\u003e", "to": "ent:dna_from_a_different_species"}, {"arrows": "to", "color": "#888888", "from": "ent:transgenic_organisms", "label": "possess", "title": "\u003cb\u003epossess\u003c/b\u003e\u003cbr\u003e\u003ci\u003eTransgenic organisms possess DNA from a different species, usually generated by molecular cloning techniques.\u003c/i\u003e", "to": "ent:dna_from_a_different_species"}, {"arrows": "to", "color": "#888888", "from": "ent:transgenic_sheep_and_goat_milk", "label": "expressed in", "title": "\u003cb\u003eexpressed in\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSeveral human proteins are expressed in transgenic sheep
