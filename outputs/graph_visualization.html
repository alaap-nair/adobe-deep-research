 original site in the genome, such as is the case with treatment of severe combined immunodeficiency (SCID).\u003c/i\u003e", "to": "ent:the_mutation"}, {"arrows": "to", "color": "#888888", "from": "ent:agrobacterium_tumefaciens", "label": "transfer DNA to", "title": "\u003cb\u003etransfer DNA to\u003c/b\u003e\u003cbr\u003e\u003ci\u003eAgrobacterium tumefaciens occur by DNA transfer from the bacterium to the plant.\u003c/i\u003e", "to": "ent:plant"}, {"arrows": "to", "color": "#888888", "from": "ent:alcohol", "label": "precipitates", "title": "\u003cb\u003eprecipitates\u003c/b\u003e\u003cbr\u003e\u003ci\u003eUsing alcohol precipitates the DNA.\u003c/i\u003e", "to": "ent:dna"}, {"arrows": "to", "color": "#888888", "from": "ent:animals", "label": "modified to express", "title": "\u003cb\u003emodified to express\u003c/b\u003e\u003cbr\u003e\u003ci\u003eWe call animals that have been modified to express recombinant DNA transgenic animals.\u003c/i\u003e", "to": "ent:recombinant_dna"}, {"arrows": "to", "color": "#888888", "from": "ent:antibiotic_resistance", "label": "is the ability", "title": "\u003cb\u003eis the ability\u003c/b\u003e\u003cbr\u003e\u003ci\u003eantibiotic resistance ability of an organism to be unaffected by an antibiotic\u0027s actions\u003c/i\u003e", "to": "ent:an_organism"}, {"arrows": "to", "color": "#888888", "from": "ent:antibiotics", "label": "are a product", "title": "\u003cb\u003eare a product\u003c/b\u003e\u003cbr\u003e\u003ci\u003eAntibiotics are a biotechnological product.\u003c/i\u003e", "to": "ent:biotechnology"}, {"arrows": "to", "color": "#888888", "from": "ent:antibiotics", "label": "are examples of", "title": "\u003cb\u003eare examples of\u003c/b\u003e\u003cbr\u003e\u003ci\u003eVaccines, antibiotics, and hormones are examples of products obtained by recombinant DNA technology.\u003c/i\u003e", "to": "ent:products_obtained_by_recombinant_dna_technology"}, {"arrows": "to", "color": "#888888", "from": "ent:antibodies", "label": "are", "title": "\u003cb\u003eare\u003c/b\u003e\u003cbr\u003e\u003ci\u003eAntibodies that defend against foreign particles are also proteins.\u003c/i\u003e", "to": "ent:proteins"}, {"arrows": "to", "color": "#888888", "from": "ent:automation", "label": "may lead to", "title": "\u003cb\u003emay lead to\u003c/b\u003e\u003cbr\u003e\u003ci\u003eAutomation and the decreased cost of whole-genome sequencing may lead to personalized medicine in the future.\u003c/i\u003e", "to": "ent:personalized_medicine"}, {"arrows": "to", "color": "#888888", "from": "ent:bacillus_thuringiensis", "label": "produces protein crystals", "title": "\u003cb\u003eproduces protein crystals\u003c/b\u003e\u003cbr\u003e\u003ci\u003eBacillus thuringiensis (Bt) is a bacterium that produces protein crystals during sporulation that are toxic to many insect species that affect plants.\u003c/i\u003e", "to": "ent:during_sporulation"}, {"arrows": "to", "color": "#888888", "from": "ent:bait_protein", "label": "attaches to", "title": "\u003cb\u003eattaches to\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe bait protein attaches to the BD, and the prey protein attaches to the AD.\u003c/i\u003e", "to": "ent:bd"}, {"arrows": "to", "color": "#888888", "from": "ent:binding_domain", "label": "binds", "title": "\u003cb\u003ebinds\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe binding domain is able to bind the promoter in the activator domain\u0027s absence, but it does not turn on transcription.\u003c/i\u003e", "to": "ent:promoter"}, {"arrows": "to", "color": "#888888", "from": "ent:biomarker", "label": "is a protein", "title": "\u003cb\u003eis a protein\u003c/b\u003e\u003cbr\u003e\u003ci\u003ebiomarker individual protein that is uniquely produced in a diseased state\u003c/i\u003e", "to": "ent:individual_protein"}, {"arrows": "to", "color": "#888888", "from": "ent:biomarker_or_protein_signature", "label": "must secrete in", "title": "\u003cb\u003emust secrete in\u003c/b\u003e\u003cbr\u003e\u003ci\u003eFor a biomarker or protein signature to be useful as a candidate for early cancer screening and detection, they must secrete in body fluids, such as sweat, blood, or urine, such that health professionals can perform large-scale screenings in a noninvasive fashion.\u003c/i\u003e", "to": "ent:body_fluids"}, {"arrows": "to", "color": "#888888", "from": "ent:biomarkers", "label": "have", "title": "\u003cb\u003ehave\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe current problem with using biomarkers for early cancer detection is the high rate of false-negative results.\u003c/i\u003e", "to": "ent:high_rate_of_false-negative_results"}, {"arrows": "to", "color": "#888888", "from": "ent:biomedical_proteomics_program", "label": "identifies", "title": "\u003cb\u003eidentifies\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe Biomedical Proteomics Program identifies protein signatures and designs effective therapies for cancer patients.\u003c/i\u003e", "to": "ent:protein_signatures"}, {"arrows": "to", "color": "#888888", "from": "ent:biomedical_proteomics_program", "label": "designs", "title": "\u003cb\u003edesigns\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe Biomedical Proteomics Program identifies protein signatures and designs effective therapies for cancer patients.\u003c/i\u003e", "to": "ent:effective_therapies_for_cancer_patients"}, {"arrows": "to", "color": "#888888", "from": "ent:biotechnology", "label": "uses biological agents", "title": "\u003cb\u003euses biological agents\u003c/b\u003e\u003cbr\u003e\u003ci\u003ebiotechnology use of biological agents for technological advancement\u003c/i\u003e", "to": "ent:biological_agents"}, {"arrows": "to", "color": "#888888", "from": "ent:biotechnology", "label": "was used for", "title": "\u003cb\u003ewas used for\u003c/b\u003e\u003cbr\u003e\u003ci\u003eBiotechnology was used for breeding livestock and crops long before people understood the scientific basis of these techniques.\u003c/i\u003e", "to": "ent:breeding_livestock_and_crops"}, {"arrows": "to", "color": "#888888", "from": "ent:biotechnology", "label": "has applications", "title": "\u003cb\u003ehas applications\u003c/b\u003e\u003cbr\u003e\u003ci\u003eBiotechnology also has many industrial applications, such as fermentation, treating oil spills, and producing biofuels (Figure 17.2).\u003c/i\u003e", "to": "ent:fermentation"}, {"arrows": "to", "color": "#888888", "from": "ent:biotechnology", "label": "has applications", "title": "\u003cb\u003ehas applications\u003c/b\u003e\u003cbr\u003e\u003ci\u003eBiotechnology also has many industrial applications, such as fermentation, treating oil spills, and producing biofuels (Figure 17.2).\u003c/i\u003e", "to": "ent:treating_oil_spills"}, {"arrows": "to", "color": "#888888", "from": "ent:biotechnology", "label": "has applications", "title": "\u003cb\u003ehas applications\u003c/b\u003e\u003cbr\u003e\u003ci\u003eBiotechnology also has many industrial applications, such as fermentation, treating oil spills, and producing biofuels (Figure 17.2).\u003c/i\u003e", "to": "ent:producing_biofuels"}, {"arrows": "to", "color": "#888888", "from": "ent:biotechnology", "label": "used for", "title": "\u003cb\u003eused for\u003c/b\u003e\u003cbr\u003e\u003ci\u003eIt is easy to see how biotechnology can be used for medicinal purposes.\u003c/i\u003e", "to": "ent:medicinal_purposes"}, {"arrows": "to", "color": "#888888", "from": "ent:biotechnology", "label": "provides methods", "title": "\u003cb\u003eprovides methods\u003c/b\u003e\u003cbr\u003e\u003ci\u003eprovides methods to treat disease.\u003c/i\u003e", "to": "ent:treat_disease"}, {"arrows": "to", "color": "#888888", "from": "ent:biotechnology_in_agriculture", "label": "can enhance", "title": "\u003cb\u003ecan enhance\u003c/b\u003e\u003cbr\u003e\u003ci\u003eBiotechnology in agriculture can enhance resistance to disease, pest, and environmental stress, and improve both crop yield and quality.\u003c/i\u003e", "to": "ent:resistance_to_disease"}, {"arrows": "to", "color": "#888888", "from": "ent:biotechnology_in_agriculture", "label": "can enhance", "title": "\u003cb\u003ecan enhance\u003c/b\u003e\u003cbr\u003e\u003ci\u003eBiotechnology in agriculture can enhance resistance to disease, pest, and environmental stress, and improve both crop yield and quality.\u003c/i\u003e", "to": "ent:resistance_to_pest"}, {"arrows": "to", "color": "#888888", "from": "ent:biotechnology_in_agriculture", "label": "can enhance", "title": "\u003cb\u003ecan enhance\u003c/b\u003e\u003cbr\u003e\u003ci\u003eBiotechnology in agriculture can enhance resistance to disease, pest, and environmental stress, and improve both crop yield and quality.\u003c/i\u003e", "to": "ent:resistance_to_environmental_stress"}, {"arrows": "to", "color": "#888888", "from": "ent:biotechnology_in_agriculture", "label": "can improve", "title": "\u003cb\u003ecan improve\u003c/b\u003e\u003cbr\u003e\u003ci\u003eBiotechnology in agriculture can enhance resistance to disease, pest, and environmental stress, and improve both crop yield and quality.\u003c/i\u003e", "to": "ent:crop_yield"}, {"arrows": "to", "color": "#888888", "from": "ent:biotechnology_in_agriculture", "label": "can improve", "title": "\u003cb\u003ecan improve\u003c/b\u003e\u003cbr\u003e\u003ci\u003eBiotechnology in agriculture can enhance resistance to disease, pest, and environmental stress, and improve both crop yield and quality.\u003c/i\u003e", "to": "ent:crop_quality"}, {"arrows": "to", "color": "#888888", "from": "ent:blast", "label": "is a", "title": "\u003cb\u003eis a\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe following website uses a software program called BLAST (basic local alignment search tool) (http://blast.ncbi.nlm.nih.gov/Blast.cgi).\u003c/i\u003e", "to": "ent:software_program"}, {"arrows": "to", "color": "#888888", "from": "ent:blastocyst_stage", "label": "implanted in", "title": "\u003cb\u003eimplanted in\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThey then introduced the nucleus from a second sheep into the cell, which divided to the blastocyst stage before they implanted it in a surrogate mother.\u003c/i\u003e", "to": "ent:surrogate_mother"}, {"arrows": "to", "color": "#888888", "from": "ent:bt_toxin", "label": "activates in", "title": "\u003cb\u003eactivates in\u003c/b\u003e\u003cbr\u003e\u003ci\u003eAfter the toxin activates in the insects\u0027 intestines, they die within a couple of days.\u003c/i\u003e", "to": "ent:insects\u0027_intestines"}, {"arrows": "to", "color": "#888888", "from": "ent:bt_toxin", "label": "is safe for", "title": "\u003cb\u003eis safe for\u003c/b\u003e\u003cbr\u003e\u003ci\u003eBt toxin is safe for the environment, nontoxic to humans and other mammals, and organic farmers have approved it as a natural insecticide.\u003c/i\u003e", "to": "ent:environment"}, {"arrows": "to", "color": "#888888", "from": "ent:bt_toxin", "label": "is produced by", "title": "\u003cb\u003eis produced by\u003c/b\u003e\u003cbr\u003e\u003ci\u003ean organic insecticide produced by bacteria\u003c/i\u003e", "to": "ent:bacteria"}, {"arrows": "to", "color": "#888888", "from": "ent:ca-125", "label": "is example of", "title": "\u003cb\u003eis example of\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSome examples of protein biomarkers in cancer detection are CA-125 for ovarian cancer and PSA for prostate cancer.\u003c/i\u003e", "to": "ent:protein_biomarkers_in_cancer_detection"}, {"arrows": "to", "color": "#888888", "from": "ent:cdna", "label": "made from", "title": "\u003cb\u003emade from\u003c/b\u003e\u003cbr\u003e\u003ci\u003eReverse transcriptase PCR (RT-PCR) is similar to PCR, but cDNA is made from an RNA template before PCR begins.\u003c/i\u003e", "to": "ent:an_rna_template"}, {"arrows": "to", "color": "#888888", "from": "ent:cdna", "label": "recreate", "title": "\u003cb\u003erecreate\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe first step is to recreate the original DNA template strand (called cDNA) by applying DNA nucleotides to the mRNA.\u003c/i\u003e", "to": "ent:the_original_dna_template_strand"}, {"arrows": "to", "color": "#888888", "from": "ent:cdna", "label": "amplify", "title": "\u003cb\u003eamplify\u003c/b\u003e\u003cbr\u003e\u003ci\u003eAfter the cDNA is made, regular PCR can be used to amplify it.\u003c/i\u003e", "to": "ent:regular_pcr"}, {"arrows": "to", "color": "#888888", "from": "ent:cdna_library", "label": "is a collection", "title": "\u003cb\u003eis a collection\u003c/b\u003e\u003cbr\u003e\u003ci\u003ecDNA library collection of cloned cDNA sequences\u003c/i\u003e", "to": "ent:cloned_cdna_sequences"}, {"arrows": "to", "color": "#888888", "from": "ent:cell", "label": "divided to", "title": "\u003cb\u003edivided to\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThey then introduced the nucleus from a second sheep into the cell, which divided to the blastocyst stage before they implanted it in a surrogate mother.\u003c/i\u003e", "to": "ent:blastocyst_stage"}, {"arrows": "to", "color": "#888888", "from": "ent:cellular_cloning", "label": "produces identical cell populations", "title": "\u003cb\u003eproduces identical cell populations\u003c/b\u003e\u003cbr\u003e\u003ci\u003ecellular cloning production of identical cell populations by binary fission\u003c/i\u003e", "to": "ent:identical_cell_populations"}, {"arrows": "to", "color": "#888888", "from": "ent:certain_chromosome_regions", "label": "are subject to", "title": "\u003cb\u003eare subject to\u003c/b\u003e\u003cbr\u003e\u003ci\u003eCertain chromosome regions that are subject to polymorphism will lead to generating the unique banding pattern.\u003c/i\u003e", "to": "ent:polymorphism"}, {"arrows": "to", "color": "#888888", "from": "ent:chain_termination_method", "label": "involves DNA replication of", "title": "\u003cb\u003einvolves DNA replication of\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe chain termination method involves DNA replication of a single-stranded template by using a primer and a regular deoxynucleotide (dNTP), which is a monomer, or a single DNA unit.\u003c/i\u003e", "to": "ent:single-stranded_template"}, {"arrows": "to", "color": "#888888", "from": "ent:chain_termination_method", "label": "uses", "title": "\u003cb\u003euses\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe chain termination method involves DNA replication of a single-stranded template by using a primer and a regular deoxynucleotide (dNTP), which is a monomer, or a single DNA unit.\u003c/i\u003e", "to": "ent:primer_and_dntp"}, {"arrows": "to", "color": "#888888", "from": "ent:chain_termination_method", "label": "mixes with", "title": "\u003cb\u003emixes with\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe primer and dNTP mix with a small proportion of fluorescently labeled dideoxynucleotides (ddNTPs).\u003c/i\u003e", "to": "ent:fluorescently_labeled_dideoxynucleotides_(ddntps)"}, {"arrows": "to", "color": "#888888", "from": "ent:chain_termination_method", "label": "uses labeled dideoxynucleotides", "title": "\u003cb\u003euses labeled dideoxynucleotides\u003c/b\u003e\u003cbr\u003e\u003ci\u003echain termination method method of DNA sequencing using labeled dideoxynucleotides to terminate DNA replication\u003c/i\u003e", "to": "ent:labeled_dideoxynucleotides"}, {"arrows": "to", "color": "#888888", "from": "ent:changes_in_gene_expression", "label": "provide information about", "title": "\u003cb\u003eprovide information about\u003c/b\u003e\u003cbr\u003e\u003ci\u003eStudying changes in gene expression could provide information about the transcription profile in the drug\u0027s presence, which we can use as an early indicator of the potential for toxic effects.\u003c/i\u003e", "to": "ent:the_transcription_profile"}, {"arrows": "to", "color": "#888888", "from": "ent:chicken_eggs", "label": "expressed in", "title": "\u003cb\u003eexpressed in\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSeveral human proteins are expressed in transgenic sheep and goat milk, and some are expressed in chicken eggs.\u003c/i\u003e", "to": "ent:human_proteins"}, {"arrows": "to", "color": "#888888", "from": "ent:classical_methods", "label": "began with", "title": "\u003cb\u003ebegan with\u003c/b\u003e\u003cbr\u003e\u003ci\u003eAlthough classical methods of studying gene function began with a given phenotype and determined the genetic basis of that phenotype, modern techniques allow researchers to start at the DNA sequence level and ask: \"What does this gene or DNA element do?\"\u003c/i\u003e", "to": "ent:given_phenotype"}, {"arrows": "to", "color": "#888888", "from": "ent:clinical_proteomic_technologies_for_cancer_and_the_early_detection_research_network", "label": "are efforts to identify", "title": "\u003cb\u003eare efforts to identify\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe Clinical Proteomic Technologies for Cancer and the Early Detection Research Network are efforts to identify protein signatures specific to different cancer types.\u003c/i\u003e", "to": "ent:protein_signatures_specific_to_different_cancer_types"}, {"arrows": "to", "color": "#888888", "from": "ent:clone", "label": "is an exact replica", "title": "\u003cb\u003eis an exact replica\u003c/b\u003e\u003cbr\u003e\u003ci\u003eclone exact replica\u003c/i\u003e", "to": "ent:exact_replica"}, {"arrows": "to", "color": "#888888", "from": "ent:cloned_animals", "label": "exhibit", "title": "\u003cb\u003eexhibit\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSince Dolly, scientists have cloned successfully several animals such as horses, bulls, and goats, although these animals often exhibit facial, limb, and cardiac abnormalities.\u003c/i\u003e", "to": "ent:abnormalities"}, {"arrows": "to", "color": "#888888", "from": "ent:cloning", "label": "may refer to", "title": "\u003cb\u003emay refer to\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe term \u201ccloning\u201d may refer to cloning small DNA fragments (molecular cloning), cloning cell populations (cellular cloning), or cloning entire organisms (reproductive cloning).\u003c/i\u003e", "to": "ent:cloning_small_dna_fragments"}, {"arrows": "to", "color": "#888888", "from": "ent:cloning", "label": "may refer to", "title": "\u003cb\u003emay refer to\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe term \u201ccloning\u201d may refer to cloning small DNA fragments (molecular cloning), cloning cell populations (cellular cloning), or cloning entire organisms (reproductive cloning).\u003c/i\u003e", "to": "ent:cloning_cell_populations"}, {"arrows": "to", "color": "#888888", "from": "ent:cloning", "label": "may refer to", "title": "\u003cb\u003emay refer to\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe term \u201ccloning\u201d may refer to cloning small DNA fragments (molecular cloning), cloning cell populations (cellular cloning), or cloning entire organisms (reproductive cloning).\u003c/i\u003e", "to": "ent:cloning_entire_organisms"}, {"arrows": "to", "color": "#888888", "from": "ent:common_diseases", "label": "are", "title": "\u003cb\u003eare\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMost of the common diseases, such as heart disease, are multi-factored or polygenic, which is a phenotypic characteristic that involves two or more genes, and also involve environmental factors such as diet.\u003c/i\u003e", "to": "ent:multi-factored_or_polygenic"}, {"arrows": "to", "color": "#888888", "from": "ent:contig", "label": "is a sequence", "title": "\u003cb\u003eis a sequence\u003c/b\u003e\u003cbr\u003e\u003ci\u003econtig larger sequence of DNA assembled from overlapping shorter sequences\u003c/i\u003e", "to": "ent:larger_sequence_of_dna"}, {"arrows": "to", "color": "#888888", "from": "ent:craig_venter", "label": "sequenced", "title": "\u003cb\u003esequenced\u003c/b\u003e\u003cbr\u003e\u003ci\u003eAmerican biotechnologist, biochemist, geneticist, and businessman Craig Venter sequenced the bacterium Haemophilus influenzae in the 1980s.\u003c/i\u003e", "to": "ent:bacterium_haemophilus_influenzae"}, {"arrows": "to", "color": "#888888", "from": "ent:creating_cdna_libraries", "label": "speeds", "title": "\u003cb\u003espeeds\u003c/b\u003e\u003cbr\u003e\u003ci\u003eCreating genomic libraries and complementary DNA (cDNA) libraries (collections of cloned sequences or all DNA from a genome) has sped the physical mapping process.\u003c/i\u003e", "to": "ent:the_physical_mapping_process"}, {"arrows": "to", "color": "#888888", "from": "ent:creating_genomic_libraries", "label": "speeds", "title": "\u003cb\u003espeeds\u003c/b\u003e\u003cbr\u003e\u003ci\u003eCreating genomic libraries and complementary DNA (cDNA) libraries (collections of cloned sequences or all DNA from a genome) has sped the physical mapping process.\u003c/i\u003e", "to": "ent:the_physical_mapping_process"}, {"arrows": "to", "color": "#888888", "from": "ent:cultivating_and_manipulating_fungal_cells", "label": "produces", "title": "\u003cb\u003eproduces\u003c/b\u003e\u003cbr\u003e\u003ci\u003eCultivating and manipulating fungal cells produces antibiotics.\u003c/i\u003e", "to": "ent:antibiotics"}, {"arrows": "to", "color": "#888888", "from": "ent:cytogenetic_mapping", "label": "uses information from", "title": "\u003cb\u003euses information from\u003c/b\u003e\u003cbr\u003e\u003ci\u003eCytogenetic mapping uses information from microscopic analysis of stained chromosome sections (Figure 17.12).\u003c/i\u003e", "to": "ent:microscopic_analysis_of_stained_chromosome_sections"}, {"arrows": "to", "color": "#888888", "from": "ent:cytogenetic_mapping", "label": "determines", "title": "\u003cb\u003edetermines\u003c/b\u003e\u003cbr\u003e\u003ci\u003eIt is possible to determine the approximate distance between genetic markers using cytogenetic mapping, but not the exact distance (number of base pairs).\u003c/i\u003e", "to": "ent:the_approximate_distance_between_genetic_markers"}, {"arrows": "to", "color": "#888888", "from": "ent:cytogenetic_mapping", "label": "uses a microscope", "title": "\u003cb\u003euses a microscope\u003c/b\u003e\u003cbr\u003e\u003ci\u003ecytogenetic mapping technique that uses a microscope to create a map from stained chromosomes\u003c/i\u003e", "to": "ent:a_microscope"}, {"arrows": "to", "color": "#888888", "from": "ent:ddntps", "label": "are missing", "title": "\u003cb\u003eare missing\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe ddNTPs are monomers that are missing a hydroxyl group (\u2013OH) at the site at which another nucleotide usually attaches to form a chain (Figure 17.13).\u003c/i\u003e", "to": "ent:hydroxyl_group"}, {"arrows": "to", "color": "#888888", "from": "ent:ddntps", "label": "are labeled with", "title": "\u003cb\u003eare labeled with\u003c/b\u003e\u003cbr\u003e\u003ci\u003eScientists label each ddNTP with a different color of fluorophore.\u003c/i\u003e", "to": "ent:different_color_of_fluorophore"}, {"arrows": "to", "color": "#888888", "from": "ent:ddntps", "label": "terminates", "title": "\u003cb\u003eterminates\u003c/b\u003e\u003cbr\u003e\u003ci\u003eEvery time a ddNTP incorporates in the growing complementary strand, it terminates the DNA replication process, which results in multiple short strands of replicated DNA that each terminate at a different point during replication.\u003c/i\u003e", "to": "ent:dna_replication_process"}, {"arrows": "to", "color": "#888888", "from": "ent:ddntps", "label": "are fluorescently labeled", "title": "\u003cb\u003eare fluorescently labeled\u003c/b\u003e\u003cbr\u003e\u003ci\u003eBecause the ddNTPs are fluorescently labeled, each band on the gel reflects the DNA strand\u2019s size and the ddNTP that terminated the reaction.\u003c/i\u003e", "to": "ent:each_band_on_the_gel"}, {"arrows": "to", "color": "#888888", "from": "ent:deoxynucleotide", "label": "is a DNA monomer", "title": "\u003cb\u003eis a DNA monomer\u003c/b\u003e\u003cbr\u003e\u003ci\u003edeoxynucleotide individual DNA monomer (single unit)\u003c/i\u003e", "to": "ent:individual_dna_monomer"}, {"arrows": "to", "color": "#888888", "from": "ent:desired_genes", "label": "expressed in", "title": "\u003cb\u003eexpressed in\u003c/b\u003e\u003cbr\u003e\u003ci\u003eFor this reason, the desired genes are cloned and expressed in animals, such as sheep, goats, chickens, and mice.\u003c/i\u003e", "to": "ent:animals"}, {"arrows": "to", "color": "#888888", "from": "ent:dideoxynucleotide", "label": "is similar in structure to", "title": "\u003cb\u003eis similar in structure to\u003c/b\u003e\u003cbr\u003e\u003ci\u003eA dideoxynucleotide is similar in structure to a deoxynucleotide, but is missing the 3\u0027 hydroxyl group (indicated by the box).\u003c/i\u003e", "to": "ent:a_deoxynucleotide"}, {"arrows": "to", "color": "#888888", "from": "ent:dideoxynucleotide", "label": "stops", "title": "\u003cb\u003estops\u003c/b\u003e\u003cbr\u003e\u003ci\u003eWhen a dideoxynucleotide is incorporated into a DNA strand, DNA synthesis stops.\u003c/i\u003e", "to": "ent:dna_synthesis"}, {"arrows": "to", "color": "#888888", "from": "ent:dideoxynucleotide", "label": "is a DNA monomer", "title": "\u003cb\u003eis a DNA monomer\u003c/b\u003e\u003cbr\u003e\u003ci\u003edideoxynucleotide individual DNA monomer that is missing a hydroxyl group (\u2013OH)\u003c/i\u003e", "to": "ent:individual_dna_monomer"}, {"arrows": "to", "color": "#888888", "from": "ent:discovery_of_the_structure_of_dna", "label": "has led to", "title": "\u003cb\u003ehas led to\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSince the discovery of the structure of DNA in 1953, the biotechnology field has grown rapidly through both academic research and private companies.\u003c/i\u003e", "to": "ent:growth_of_biotechnology"}, {"arrows": "to", "color": "#888888", "from": "ent:dna", "label": "has strands", "title": "\u003cb\u003ehas strands\u003c/b\u003e\u003cbr\u003e\u003ci\u003eDNA has two complementary strands linked by hydrogen bonds between the paired bases.\u003c/i\u003e", "to": "ent:complementary_strands"}, {"arrows": "to", "color": "#888888", "from": "ent:dna_fragments", "label": "are analyzed using", "title": "\u003cb\u003eare analyzed using\u003c/b\u003e\u003cbr\u003e\u003ci\u003eWe can detect RFLPs (sometimes pronounced \u201crif-lips\u201d) when the DNA of an individual is cut with a restriction endonuclease that recognizes specific sequences in the DNA to generate a series of DNA fragments, which we can then analyze using gel electrophoresis.\u003c/i\u003e", "to": "ent:gel_electrophoresis"}, {"arrows": "to", "color": "#888888", "from": "ent:dna_from_ti_plasmid", "label": "integrates into", "title": "\u003cb\u003eintegrates into\u003c/b\u003e\u003cbr\u003e\u003ci\u003eDNA from the Ti plasmid integrates into the infected plant cell\u2019s genome.\u003c/i\u003e", "to": "ent:infected_plant_cell\u2019s_genome"}, {"arrows": "to", "color": "#888888", "from": "ent:dna_ligase", "label": "joins", "title": "\u003cb\u003ejoins\u003c/b\u003e\u003cbr\u003e\u003ci\u003eAdding the enzyme DNA ligase permanently joins the DNA fragments via phosphodiester bonds.\u003c/i\u003e", "to": "ent:dna_fragments"}, {"arrows": "to", "color": "#888888", "from": "ent:dna_microarray", "label": "detects gene expression", "title": "\u003cb\u003edetects gene expression\u003c/b\u003e\u003cbr\u003e\u003ci\u003eDNA microarray method to detect gene expression by analyzing many DNA fragments that are fixed to a glass slide or a silicon chip to identify active genes and identify sequences\u003c/i\u003e", "to": "ent:gene_expression"}, {"arrows": "to", "color": "#888888", "from": "ent:dna_microarrays", "label": "are methods", "title": "\u003cb\u003eare methods\u003c/b\u003e\u003cbr\u003e\u003ci\u003eDNA microarrays are methods that scientists use to detect gene expression by analyzing different DNA fragments that are fixed to a glass slide or a silicon chip to identify active genes and sequences.\u003c/i\u003e", "to": "ent:scientists_use_to_detect_gene_expression"}, {"arrows": "to", "color": "#888888", "from": "ent:dna_microarrays", "label": "analyze", "title": "\u003cb\u003eanalyze\u003c/b\u003e\u003cbr\u003e\u003ci\u003eDNA microarrays are methods that scientists use to detect gene expression by analyzing different DNA fragments that are fixed to a glass slide or a silicon chip to identify active genes and sequences.\u003c/i\u003e", "to": "ent:different_dna_fragments"}, {"arrows": "to", "color": "#888888", "from": "ent:dna_microarrays", "label": "identify", "title": "\u003cb\u003eidentify\u003c/b\u003e\u003cbr\u003e\u003ci\u003eDNA microarrays are methods that scientists use to detect gene expression by analyzing different DNA fragments that are fixed to a glass slide or a silicon chip to identify active genes and sequences.\u003c/i\u003e", "to": "ent:active_genes_and_sequences"}, {"arrows": "to", "color": "#888888", "from": "ent:dna_polymerase_enzyme", "label": "can replicate", "title": "\u003cb\u003ecan replicate\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe DNA polymerase enzyme can replicate the DNA.\u003c/i\u003e", "to": "ent:dna"}, {"arrows": "to", "color": "#888888", "from": "ent:dna_samples", "label": "can be stored", "title": "\u003cb\u003ecan be stored\u003c/b\u003e\u003cbr\u003e\u003ci\u003eOne can store the DNA samples frozen at \u201380\u00b0C for several years.\u003c/i\u003e", "to": "ent:frozen_at_\u201380\u00b0c"}, {"arrows": "to", "color": "#888888", "from": "ent:dna_sequencing_technology", "label": "has contributed to", "title": "\u003cb\u003ehas contributed to\u003c/b\u003e\u003cbr\u003e\u003ci\u003eDNA sequencing technology has contributed to advances in genomics.\u003c/i\u003e", "to": "ent:advances_in_genomics"}, {"arrows": "to", "color": "#888888", "from": "ent:dna\u0027s_age", "label": "may affect", "title": "\u003cb\u003emay affect\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThere is speculation that because the cell DNA belongs to an older individual, DNA\u0027s age may affect a cloned individual\u0027s life expectancy.\u003c/i\u003e", "to": "ent:cloned_individual\u0027s_life_expectancy"}, {"arrows": "to", "color": "#888888", "from": "ent:doctors", "label": "advise", "title": "\u003cb\u003eadvise\u003c/b\u003e\u003cbr\u003e\u003ci\u003eDepending on the inheritance patterns of a disease-causing gene, family members are advised to undergo genetic testing.\u003c/i\u003e", "to": "ent:genetic_testing"}, {"arrows": "to", "color": "#888888", "from": "ent:doctors", "label": "advise", "title": "\u003cb\u003eadvise\u003c/b\u003e\u003cbr\u003e\u003ci\u003eFor example, doctors usually advise people diagnosed with breast cancer to have a biopsy so that the medical team can determine the genetic basis of cancer development.\u003c/i\u003e", "to": "ent:biopsy"}, {"arrows": "to", "color": "#888888", "from": "ent:doctors", "label": "base treatment plans on", "title": "\u003cb\u003ebase treatment plans on\u003c/b\u003e\u003cbr\u003e\u003ci\u003eDoctors base treatment plans on genetic test findings that determine the type of cancer.\u003c/i\u003e", "to": "ent:genetic_test_findings"}, {"arrows": "to", "color": "#888888", "from": "ent:doctors", "label": "advise", "title": "\u003cb\u003eadvise\u003c/b\u003e\u003cbr\u003e\u003ci\u003eIf inherited gene mutations cause the cancer, doctors also advise other female relatives to undergo genetic testing and periodic screening for breast cancer.\u003c/i\u003e", "to": "ent:genetic_testing_for_other_female_relatives"}, {"arrows": "to", "color": "#888888", "from": "ent:doctors", "label": "offer genetic testing for", "title": "\u003cb\u003eoffer genetic testing for\u003c/b\u003e\u003cbr\u003e\u003ci\u003eDoctors also offer genetic testing for fetuses (or embryos with in vitro fertilization) to determine the presence or absence of disease-causing genes in families with specific debilitating diseases.\u003c/i\u003e", "to": "ent:fetuses"}, {"arrows": "to", "color": "#888888", "from": "ent:doctors", "label": "introduce", "title": "\u003cb\u003eintroduce\u003c/b\u003e\u003cbr\u003e\u003ci\u003eDoctors then introduce the antigen into the body to stimulate the primary immune response and trigger immune memory.\u003c/i\u003e", "to": "ent:the_antigen_into_the_body"}, {"arrows": "to", "color": "#888888", "from": "ent:doctors", "label": "use", "title": "\u003cb\u003euse\u003c/b\u003e\u003cbr\u003e\u003ci\u003eIn addition, doctors use human growth hormone (HGH) to treat growth disorders in children.\u003c/i\u003e", "to": "ent:human_growth_hormone"}, {"arrows": "to", "color": "#888888", "from": "ent:doctors", "label": "use whole-genome sequencing", "title": "\u003cb\u003euse whole-genome sequencing\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSome doctors are using whole-genome sequencing to save lives.\u003c/i\u003e", "to": "ent:whole-genome_sequencing"}, {"arrows": "to", "color": "#888888", "from": "ent:dolly", "label": "is the first cloned", "title": "\u003cb\u003eis the first cloned\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe first cloned animal was Dolly, a sheep born in 1996.\u003c/i\u003e", "to": "ent:animal"}, {"arrows": "to", "color": "#888888", "from": "ent:dolly", "label": "died of", "title": "\u003cb\u003edied of\u003c/b\u003e\u003cbr\u003e\u003ci\u003eDolly lived for seven years and died of respiratory complications (Figure 17.8).\u003c/i\u003e", "to": "ent:respiratory_complications"}, {"arrows": "to", "color": "#888888", "from": "ent:dolly_the_sheep", "label": "was cloned", "title": "\u003cb\u003ewas cloned\u003c/b\u003e\u003cbr\u003e\u003ci\u003eDolly the sheep was the first mammal to be cloned.\u003c/i\u003e", "to": "ent:first_mammal"}, {"arrows": "to", "color": "#888888", "from": "ent:donor_egg_cell", "label": "removed nucleus from", "title": "\u003cb\u003eremoved nucleus from\u003c/b\u003e\u003cbr\u003e\u003ci\u003eTo create Dolly, they removed the nucleus from a donor egg cell.\u003c/i\u003e", "to": "ent:dolly_the_sheep"}, {"arrows": "to", "color": "#888888", "from": "ent:early_genetic_maps", "label": "based on", "title": "\u003cb\u003ebased on\u003c/b\u003e\u003cbr\u003e\u003ci\u003eScientists based early genetic maps on using known genes as markers.\u003c/i\u003e", "to": "ent:known_genes_as_markers"}, {"arrows": "to", "color": "#888888", "from": "ent:early_geneticists", "label": "relied on", "title": "\u003cb\u003erelied on\u003c/b\u003e\u003cbr\u003e\u003ci\u003eEarly geneticists relied on observing phenotypic changes to understand an organism\u2019s genotype.\u003c/i\u003e", "to": "ent:observing_phenotypic_changes"}, {"arrows": "to", "color": "#888888", "from": "ent:egg_cell", "label": "contains", "title": "\u003cb\u003econtains\u003c/b\u003e\u003cbr\u003e\u003ci\u003eHowever, early embryonic development requires the cytoplasmic material contained in the egg cell.\u003c/i\u003e", "to": "ent:cytoplasmic_material"}, {"arrows": "to", "color": "#888888", "from": "ent:egg_cell\u0027s_haploid_nucleus", "label": "replaced by", "title": "\u003cb\u003ereplaced by\u003c/b\u003e\u003cbr\u003e\u003ci\u003eTherefore, if we replace the egg cell\u0027s haploid nucleus with a diploid nucleus from the cell of any individual of the same species (a donor), it will become a zygote that is genetically identical to the donor.\u003c/i\u003e", "to": "ent:diploid_nucleus"}, {"arrows": "to", "color": "#888888", "from": "ent:electrophoresis", "label": "processes", "title": "\u003cb\u003eprocesses\u003c/b\u003e\u003cbr\u003e\u003ci\u003eelectrophoresis processes the reaction mixture after separating into single strands, the multiple newly replicated DNA strands form a ladder because of the differing sizes.\u003c/i\u003e", "to": "ent:reaction_mixture"}, {"arrows": "to", "color": "#888888", "from": "ent:entire_genomes_sequenced", "label": "helps with", "title": "\u003cb\u003ehelps with\u003c/b\u003e\u003cbr\u003e\u003ci\u003eHaving entire genomes sequenced helps with the research efforts in these model organisms.\u003c/i\u003e", "to": "ent:research_efforts_in_model_organisms"}, {"arrows": "to", "color": "#888888", "from": "ent:enzymes", "label": "break apart", "title": "\u003cb\u003ebreak apart\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThese enzymes break apart lipid molecules in the cell membranes and nuclear membranes.\u003c/i\u003e", "to": "ent:lipid_molecules"}, {"arrows": "to", "color": "#888888", "from": "ent:enzymes", "label": "are", "title": "\u003cb\u003eare\u003c/b\u003e\u003cbr\u003e\u003ci\u003eAll enzymes (except ribozymes) are proteins that act as catalysts to affect the rate of reactions.\u003c/i\u003e", "to": "ent:proteins"}, {"arrows": "to", "color": "#888888", "from": "ent:ests", "label": "are generated after", "title": "\u003cb\u003eare generated after\u003c/b\u003e\u003cbr\u003e\u003ci\u003egenerated after a cDNA library is made\u003c/i\u003e", "to": "ent:a_cdna_library_is_made"}, {"arrows": "to", "color": "#888888", "from": "ent:ests", "label": "are useful for", "title": "\u003cb\u003eare useful for\u003c/b\u003e\u003cbr\u003e\u003ci\u003euseful for mapping using sequence information\u003c/i\u003e", "to": "ent:mapping_using_sequence_information"}, {"arrows": "to", "color": "#888888", "from": "ent:european_bioinformatics_institute", "label": "developing and establishing", "title": "\u003cb\u003edeveloping and establishing\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe European Bioinformatics Institute and the Human Proteome Organization (HUPO) are developing and establishing effective tools to sort through the enormous pile of systems biology data.\u003c/i\u003e", "to": "ent:effective_tools"}, {"arrows": "to", "color": "#888888", "from": "ent:expressed_sequence_tag", "label": "is a", "title": "\u003cb\u003eis a\u003c/b\u003e\u003cbr\u003e\u003ci\u003eAn EST is a short STS that we can identify with cDNA libraries, while we obtain SSLPs from known genetic markers, which provide a link between genetic and physical maps.\u003c/i\u003e", "to": "ent:short_sts"}, {"arrows": "to", "color": "#888888", "from": "ent:expressed_sequence_tag_(est)", "label": "is a short STS", "title": "\u003cb\u003eis a short STS\u003c/b\u003e\u003cbr\u003e\u003ci\u003eexpressed sequence tag (EST) short STS that is identified with cDNA\u003c/i\u003e", "to": "ent:short_sts"}, {"arrows": "to", "color": "#888888", "from": "ent:false_negative", "label": "is a test result", "title": "\u003cb\u003eis a test result\u003c/b\u003e\u003cbr\u003e\u003ci\u003efalse negative incorrect test result that should have been positive\u003c/i\u003e", "to": "ent:incorrect_test_result"}, {"arrows": "to", "color": "#888888", "from": "ent:first_antibiotic", "label": "discovered", "title": "\u003cb\u003ediscovered\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe first antibiotic discovered was penicillin.\u003c/i\u003e", "to": "ent:penicillin"}, {"arrows": "to", "color": "#888888", "from": "ent:flavr_savr_tomato", "label": "was created to have", "title": "\u003cb\u003ewas created to have\u003c/b\u003e\u003cbr\u003e\u003ci\u003ewas created to have better flavor and shelf-life\u003c/i\u003e", "to": "ent:better_flavor_and_shelf-life"}, {"arrows": "to", "color": "#888888", "from": "ent:flavr_savr_tomato", "label": "does not undergo", "title": "\u003cb\u003edoes not undergo\u003c/b\u003e\u003cbr\u003e\u003ci\u003edoes not undergo soft rot\u003c/i\u003e", "to": "ent:soft_rot"}, {"arrows": "to", "color": "#888888", "from": "ent:flower\u2019s_color", "label": "were linked traits", "title": "\u003cb\u003ewere linked traits\u003c/b\u003e\u003cbr\u003e\u003ci\u003eresearchers discovered, that the flower\u2019s color and plant pollen\u2019s shape were linked traits, and therefore the genes encoding these traits were in close proximity on the same chromosome.\u003c/i\u003e", "to": "ent:plant_pollen\u2019s_shape"}, {"arrows": "to", "color": "#888888", "from": "ent:fluorophore-labeled_ddntps", "label": "help identify", "title": "\u003cb\u003ehelp identify\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe different colors of the fluorophore-labeled ddNTPs help identify the ddNTP incorporated at that position.\u003c/i\u003e", "to": "ent:the_ddntp_incorporated_at_that_position"}, {"arrows": "to", "color": "#888888", "from": "ent:foreign_dna", "label": "belongs to a different species", "title": "\u003cb\u003ebelongs to a different species\u003c/b\u003e\u003cbr\u003e\u003ci\u003eforeign DNA DNA that belongs to a different species or DNA that is artificially synthesized\u003c/i\u003e", "to": "ent:a_different_species"}, {"arrows": "to", "color": "#888888", "from": "ent:foreign_genomic_dna", "label": "was degraded by", "title": "\u003cb\u003ewas degraded by\u003c/b\u003e\u003cbr\u003e\u003ci\u003eAs a result, it was degraded by nucleases, but still used in the experiment.\u003c/i\u003e", "to": "ent:nucleases"}, {"arrows": "to", "color": "#888888", "from": "ent:fred_sanger", "label": "used", "title": "\u003cb\u003eused\u003c/b\u003e\u003cbr\u003e\u003ci\u003eBritish biochemist and Nobel Prize winner Fred Sanger used a bacterial virus, the bacteriophage fx174 (5368 base pairs), to completely sequence the first genome.\u003c/i\u003e", "to": "ent:bacterial_virus"}, {"arrows": "to", "color": "#888888", "from": "ent:freda_miller_and_elaine_fuchs", "label": "discovered", "title": "\u003cb\u003ediscovered\u003c/b\u003e\u003cbr\u003e\u003ci\u003eFor example, Freda Miller and Elaine Fuchs, working independently, discovered stem cells in different layers of the skin.\u003c/i\u003e", "to": "ent:stem_cells_in_skin"}, {"arrows": "to", "color": "#888888", "from": "ent:gel", "label": "produces", "title": "\u003cb\u003eproduces\u003c/b\u003e\u003cbr\u003e\u003ci\u003eReading the gel on the basis of each band\u2019s color on the ladder produces the template strand\u2019s sequence (Figure 17.14).\u003c/i\u003e", "to": "ent:the_template_strand\u2019s_sequence"}, {"arrows": "to", "color": "#888888", "from": "ent:gel_electrophoresis", "label": "uses", "title": "\u003cb\u003euses\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGel electrophoresis is a technique that scientists use to separate molecules on the basis of size, using this charge.\u003c/i\u003e", "to": "ent:electric_field"}, {"arrows": "to", "color": "#888888", "from": "ent:gel_electrophoresis", "label": "separates", "title": "\u003cb\u003eseparates\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGel electrophoresis is a technique that scientists use to separate molecules on the basis of size, using this charge.\u003c/i\u003e", "to": "ent:nucleic_acids"}, {"arrows": "to", "color": "#888888", "from": "ent:gel_electrophoresis", "label": "separate", "title": "\u003cb\u003eseparate\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGel electrophoresis separates the nucleic acid fragments according to their size.\u003c/i\u003e", "to": "ent:nucleic_acid_fragments"}, {"arrows": "to", "color": "#888888", "from": "ent:gel_electrophoresis", "label": "separates molecules", "title": "\u003cb\u003eseparates molecules\u003c/b\u003e\u003cbr\u003e\u003ci\u003egel electrophoresis technique used to separate molecules on the basis of size using electric charge\u003c/i\u003e", "to": "ent:molecules"}, {"arrows": "to", "color": "#888888", "from": "ent:gene_mapping", "label": "led to developing", "title": "\u003cb\u003eled to developing\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGene mapping relative to each other based on linkage analysis led to developing the first genetic maps.\u003c/i\u003e", "to": "ent:the_first_genetic_maps"}, {"arrows": "to", "color": "#888888", "from": "ent:gene_targeting", "label": "uses recombinant DNA vectors", "title": "\u003cb\u003euses recombinant DNA vectors\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGene targeting is the use of recombinant DNA vectors to alter a particular gene\u0027s expression, either by introducing mutations in a gene, or by eliminating a certain gene\u0027s expression by deleting a part or all of the gene sequence from the organism\u0027s genome.\u003c/i\u003e", "to": "ent:alter_gene\u0027s_expression"}, {"arrows": "to", "color": "#888888", "from": "ent:gene_targeting", "label": "introduces mutations in", "title": "\u003cb\u003eintroduces mutations in\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGene targeting is the use of recombinant DNA vectors to alter a particular gene\u0027s expression, either by introducing mutations in a gene, or by eliminating a certain gene\u0027s expression by deleting a part or all of the gene sequence from the organism\u0027s genome.\u003c/i\u003e", "to": "ent:gene"}, {"arrows": "to", "color": "#888888", "from": "ent:gene_targeting", "label": "eliminates gene\u0027s expression", "title": "\u003cb\u003eeliminates gene\u0027s expression\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGene targeting is the use of recombinant DNA vectors to alter a particular gene\u0027s expression, either by introducing mutations in a gene, or by eliminating a certain gene\u0027s expression by deleting a part or all of the gene sequence from the organism\u0027s genome.\u003c/i\u003e", "to": "ent:deleting_gene_sequence"}, {"arrows": "to", "color": "#888888", "from": "ent:gene_targeting", "label": "alters the sequence", "title": "\u003cb\u003ealters the sequence\u003c/b\u003e\u003cbr\u003e\u003ci\u003egene targeting method for altering the sequence of a specific gene by introducing the modified version on a vector\u003c/i\u003e", "to": "ent:a_specific_gene"}, {"arrows": "to", "color": "#888888", "from": "ent:gene_therapy", "label": "is a technique", "title": "\u003cb\u003eis a technique\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGene therapy is a genetic engineering technique used to cure disease.\u003c/i\u003e", "to": "ent:cure_disease"}, {"arrows": "to", "color": "#888888", "from": "ent:gene_therapy", "label": "involves", "title": "\u003cb\u003einvolves\u003c/b\u003e\u003cbr\u003e\u003ci\u003eIn its simplest form, it involves the introduction of a good gene at a random location in the genome to aid the cure of a disease that is caused by a mutated gene.\u003c/i\u003e", "to": "ent:introduction_of_a_good_gene"}, {"arrows": "to", "color": "#888888", "from": "ent:gene_therapy", "label": "cures inheritable diseases", "title": "\u003cb\u003ecures inheritable diseases\u003c/b\u003e\u003cbr\u003e\u003ci\u003egene therapy technique used to cure inheritable diseases by replacing mutant genes with good genes\u003c/i\u003e", "to": "ent:inheritable_diseases"}, {"arrows": "to", "color": "#888888", "from": "ent:gene_therapy", "label": "can be used to introduce", "title": "\u003cb\u003ecan be used to introduce\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGene therapy can be used to introduce foreign DNA into cells of tissues to cure inheritable disease\u003c/i\u003e", "to": "ent:foreign_dna_into_cells_of_tissues_to_cure_inheritable_disease"}, {"arrows": "to", "color": "#888888", "from": "ent:gene_transfer", "label": "occurs naturally between", "title": "\u003cb\u003eoccurs naturally between\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGene transfer occurs naturally between species in microbial populations.\u003c/i\u003e", "to": "ent:species_in_microbial_populations"}, {"arrows": "to", "color": "#888888", "from": "ent:generation_of_genetic_maps", "label": "requires", "title": "\u003cb\u003erequires\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe generation of genetic maps requires markers, just as a road map requires landmarks (such as rivers and mountains).\u003c/i\u003e", "to": "ent:markers"}, {"arrows": "to", "color": "#888888", "from": "ent:genes", "label": "are physically linked by", "title": "\u003cb\u003eare physically linked by\u003c/b\u003e\u003cbr\u003e\u003ci\u003eother researchers observed that different traits were often inherited together, and thereby deduced that the genes were physically linked by their location on the same chromosome.\u003c/i\u003e", "to": "ent:location_on_the_same_chromosome"}, {"arrows": "to", "color": "#888888", "from": "ent:genes_encoding_flower\u2019s_color", "label": "are in close proximity on", "title": "\u003cb\u003eare in close proximity on\u003c/b\u003e\u003cbr\u003e\u003ci\u003eresearchers discovered, that the flower\u2019s color and plant pollen\u2019s shape were linked traits, and therefore the genes encoding these traits were in close proximity on the same chromosome.\u003c/i\u003e", "to": "ent:the_same_chromosome"}, {"arrows": "to", "color": "#888888", "from": "ent:genes_encoding_plant_pollen\u2019s_shape", "label": "are in close proximity on", "title": "\u003cb\u003eare in close proximity on\u003c/b\u003e\u003cbr\u003e\u003ci\u003eresearchers discovered, that the flower\u2019s color and plant pollen\u2019s shape were linked traits, and therefore the genes encoding these traits were in close proximity on the same chromosome.\u003c/i\u003e", "to": "ent:the_same_chromosome"}, {"arrows": "to", "color": "#888888", "from": "ent:genes_involved_in_cellular_growth", "label": "when disturbed", "title": "\u003cb\u003ewhen disturbed\u003c/b\u003e\u003cbr\u003e\u003ci\u003eFor example, genes involved in cellular growth and controlled cell death, when disturbed, could lead to cancerous cell growth.\u003c/i\u003e", "to": "ent:lead_to_cancerous_cell_growth"}, {"arrows": "to", "color": "#888888", "from": "ent:genetic_diagnosis", "label": "involves", "title": "\u003cb\u003einvolves\u003c/b\u003e\u003cbr\u003e\u003ci\u003eScientists call the process of testing for suspected genetic defects before administering treatment genetic diagnosis by genetic testing.\u003c/i\u003e", "to": "ent:testing_for_suspected_genetic_defects"}, {"arrows": "to", "color": "#888888", "from": "ent:genetic_diagnosis", "label": "analyzes disease-causing genes", "title": "\u003cb\u003eanalyzes disease-causing genes\u003c/b\u003e\u003cbr\u003e\u003ci\u003egenetic diagnosis diagnosis of the potential for disease development by analyzing disease-causing genes\u003c/i\u003e", "to": "ent:disease-causing_genes"}, {"arrows": "to", "color": "#888888", "from": "ent:genetic_engineering", "label": "is alteration of", "title": "\u003cb\u003eis alteration of\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGenetic engineering is the alteration of an organism\u2019s genotype using recombinant DNA technology to modify an organism\u2019s DNA to achieve desirable traits.\u003c/i\u003e", "to": "ent:organism\u2019s_genotype"}, {"arrows": "to", "color": "#888888", "from": "ent:genetic_engineering", "label": "uses recombinant DNA technology", "title": "\u003cb\u003euses recombinant DNA technology\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGenetic engineering is the alteration of an organism\u2019s genotype using recombinant DNA technology to modify an organism\u2019s DNA to achieve desirable traits.\u003c/i\u003e", "to": "ent:modify_organism\u2019s_dna"}, {"arrows": "to", "color": "#888888", "from": "ent:genetic_engineering", "label": "alters the genetic makeup", "title": "\u003cb\u003ealters the genetic makeup\u003c/b\u003e\u003cbr\u003e\u003ci\u003egenetic engineering alteration of the genetic makeup of an organism\u003c/i\u003e", "to": "ent:an_organism"}, {"arrows": "to", "color": "#888888", "from": "ent:genetic_map", "label": "lists genes and", "title": "\u003cb\u003elists genes and\u003c/b\u003e\u003cbr\u003e\u003ci\u003eA genetic map is an illustration that lists genes and their location on a chromosome.\u003c/i\u003e", "to": "ent:their_location_on_a_chromosome"}, {"arrows": "to", "color": "#888888", "from": "ent:genetic_map", "label": "outlines genes", "title": "\u003cb\u003eoutlines genes\u003c/b\u003e\u003cbr\u003e\u003ci\u003egenetic map outline of genes and their location on a chromosome\u003c/i\u003e", "to": "ent:genes_and_their_location"}, {"arrows": "to", "color": "#888888", "from": "ent:genetic_maps", "label": "use genetic markers", "title": "\u003cb\u003euse genetic markers\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGenetic maps provide the big picture (similar to an interstate highway map) and use genetic markers (similar to landmarks).\u003c/i\u003e", "to": "ent:similar_to_landmarks"}, {"arrows": "to", "color": "#888888", "from": "ent:genetic_maps", "label": "begin with", "title": "\u003cb\u003ebegin with\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe study of genetic maps begins with linkage analysis, a procedure that analyzes the recombination frequency between genes to determine if they are linked or show independent assortment.\u003c/i\u003e", "to": "ent:linkage_analysis"}, {"arrows": "to", "color": "#888888", "from": "ent:genetic_maps", "label": "rely on", "title": "\u003cb\u003erely on\u003c/b\u003e\u003cbr\u003e\u003ci\u003eBecause genetic maps rely completely on the natural process of recombination, natural increases or decreases in the recombination level of a given genome area affects mapping.\u003c/i\u003e", "to": "ent:the_natural_process_of_recombination"}, {"arrows": "to", "color": "#888888", "from": "ent:genetic_maps", "label": "provide", "title": "\u003cb\u003eprovide\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGenetic maps provide the outline and physical maps provide the details.\u003c/i\u003e", "to": "ent:outline"}, {"arrows": "to", "color": "#888888", "from": "ent:genetic_maps", "label": "provide outline for", "title": "\u003cb\u003eprovide outline for\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGenetic maps provide an outline for locating genes within a genome, and they estimate the distance between genes and genetic markers on the basis of recombination frequencies during meiosis.\u003c/i\u003e", "to": "ent:locating_genes_within_a_genome"}, {"arrows": "to", "color": "#888888", "from": "ent:genetic_marker", "label": "co-segregates with", "title": "\u003cb\u003eco-segregates with\u003c/b\u003e\u003cbr\u003e\u003ci\u003eA genetic marker is a gene or sequence on a chromosome that co-segregates (shows genetic linkage) with a specific trait.\u003c/i\u003e", "to": "ent:specific_trait"}, {"arrows": "to", "color": "#888888", "from": "ent:genetic_marker", "label": "is a gene", "title": "\u003cb\u003eis a gene\u003c/b\u003e\u003cbr\u003e\u003ci\u003egenetic marker gene or sequence on a chromosome with a known location that is associated with a specific trait\u003c/i\u003e", "to": "ent:gene_or_sequence"}, {"arrows": "to", "color": "#888888", "from": "ent:genetic_recombination", "label": "occurs by", "title": "\u003cb\u003eoccurs by\u003c/b\u003e\u003cbr\u003e\u003ci\u003eWe call exchanging DNA between homologous chromosome pairs genetic recombination, which occurs by crossing over DNA between homologous DNA strands, such as nonsister chromatids.\u003c/i\u003e", "to": "ent:crossing_over_dna_between_homologous_dna_strands"}, {"arrows": "to", "color": "#888888", "from": "ent:genetic_recombination", "label": "exchanges DNA", "title": "\u003cb\u003eexchanges DNA\u003c/b\u003e\u003cbr\u003e\u003ci\u003egenetic recombination DNA exchange between homologous chromosome pairs\u003c/i\u003e", "to": "ent:homologous_chromosome_pairs"}, {"arrows": "to", "color": "#888888", "from": "ent:genetic_recombination", "label": "occurs by", "title": "\u003cb\u003eoccurs by\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGenetic recombination occurs by which process? b. crossing over\u003c/i\u003e", "to": "ent:crossing_over"}, {"arrows": "to", "color": "#888888", "from": "ent:genetic_testing", "label": "tests for the presence", "title": "\u003cb\u003etests for the presence\u003c/b\u003e\u003cbr\u003e\u003ci\u003egenetic testing process of testing for the presence of disease-causing genes\u003c/i\u003e", "to": "ent:disease-causing_genes"}, {"arrows": "to", "color": "#888888", "from": "ent:genetically_modified_organism_(gmo)", "label": "has an artificially changed genome", "title": "\u003cb\u003ehas an artificially changed genome\u003c/b\u003e\u003cbr\u003e\u003ci\u003egenetically modified organism (GMO) organism whose genome has been artificially changed\u003c/i\u003e", "to": "ent:genome"}, {"arrows": "to", "color": "#888888", "from": "ent:genome_analysis", "label": "predicted", "title": "\u003cb\u003epredicted\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe analysis predicted his propensity to acquire various diseases.\u003c/i\u003e", "to": "ent:quake\u0027s_propensity_to_acquire_various_diseases"}, {"arrows": "to", "color": "#888888", "from": "ent:genome_analysis", "label": "found", "title": "\u003cb\u003efound\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe team found a rare genetic mutation, which showed him to be at risk for sudden heart attack.\u003c/i\u003e", "to": "ent:a_rare_genetic_mutation"}, {"arrows": "to", "color": "#888888", "from": "ent:genome_analysis", "label": "predicted", "title": "\u003cb\u003epredicted\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe results also predicted that Quake had a 23 percent risk of developing prostate cancer and a 1.4 percent risk of developing Alzheimer\u2019s.\u003c/i\u003e", "to": "ent:quake_had_a_23_percent_risk_of_developing_prostate_cancer"}, {"arrows": "to", "color": "#888888", "from": "ent:genome_analysis", "label": "predicted", "title": "\u003cb\u003epredicted\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe results also predicted that Quake had a 23 percent risk of developing prostate cancer and a 1.4 percent risk of developing Alzheimer\u2019s.\u003c/i\u003e", "to": "ent:quake_had_a_1.4_percent_risk_of_developing_alzheimer\u2019s"}, {"arrows": "to", "color": "#888888", "from": "ent:genome_annotation", "label": "is", "title": "\u003cb\u003eis\u003c/b\u003e\u003cbr\u003e\u003ci\u003ebiological information to gene sequences is genome annotation.\u003c/i\u003e", "to": "ent:biological_information_to_gene_sequences"}, {"arrows": "to", "color": "#888888", "from": "ent:genome_annotation", "label": "helps with", "title": "\u003cb\u003ehelps with\u003c/b\u003e\u003cbr\u003e\u003ci\u003eAnnotating gene sequences helps with basic experiments in molecular biology, such as designing PCR primers and RNA targets.\u003c/i\u003e", "to": "ent:basic_experiments_in_molecular_biology"}, {"arrows": "to", "color": "#888888", "from": "ent:genome_annotation", "label": "attaches biological information", "title": "\u003cb\u003eattaches biological information\u003c/b\u003e\u003cbr\u003e\u003ci\u003egenome annotation process of attaching biological information to gene sequences\u003c/i\u003e", "to": "ent:gene_sequences"}, {"arrows": "to", "color": "#888888", "from": "ent:genome_mapping", "label": "is the process of", "title": "\u003cb\u003eis the process of\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGenome mapping is the process of finding the locations of genes on each chromosome.\u003c/i\u003e", "to": "ent:finding_locations_of_genes"}, {"arrows": "to", "color": "#888888", "from": "ent:genome_mapping", "label": "use", "title": "\u003cb\u003euse\u003c/b\u003e\u003cbr\u003e\u003ci\u003eWe can use genome mapping in a variety of other applications, such as using live microbes to clean up pollutants or even prevent pollution.\u003c/i\u003e", "to": "ent:live_microbes_to_clean_up_pollutants"}, {"arrows": "to", "color": "#888888", "from": "ent:genome_mapping", "label": "use", "title": "\u003cb\u003euse\u003c/b\u003e\u003cbr\u003e\u003ci\u003eWe can use genome mapping in a variety of other applications, such as using live microbes to clean up pollutants or even prevent pollution.\u003c/i\u003e", "to": "ent:prevent_pollution"}, {"arrows": "to", "color": "#888888", "from": "ent:genome_mapping", "label": "is", "title": "\u003cb\u003eis\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGenome mapping is still an ongoing process, and as researchers develop more advanced techniques, they expect more breakthroughs.\u003c/i\u003e", "to": "ent:an_ongoing_process"}, {"arrows": "to", "color": "#888888", "from": "ent:genome_mapping", "label": "is similar to", "title": "\u003cb\u003eis similar to\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGenome mapping is similar to completing a complicated puzzle using every piece of available data.\u003c/i\u003e", "to": "ent:completing_a_complicated_puzzle"}, {"arrows": "to", "color": "#888888", "from": "ent:genome_mapping", "label": "finds the location", "title": "\u003cb\u003efinds the location\u003c/b\u003e\u003cbr\u003e\u003ci\u003egenome mapping process of finding the location of genes on each chromosome\u003c/i\u003e", "to": "ent:genes_on_each_chromosome"}, {"arrows": "to", "color": "#888888", "from": "ent:genome_mapping", "label": "is similar to", "title": "\u003cb\u003eis similar to\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGenome mapping is similar to solving a big, complicated puzzle with pieces of information coming from laboratories all over the world.\u003c/i\u003e", "to": "ent:solving_a_big,_complicated_puzzle"}, {"arrows": "to", "color": "#888888", "from": "ent:genome_mapping", "label": "find", "title": "\u003cb\u003efind\u003c/b\u003e\u003cbr\u003e\u003ci\u003eHow could a genetic map of the human genome help find a cure for cancer?\u003c/i\u003e", "to": "ent:cure_for_cancer"}, {"arrows": "to", "color": "#888888", "from": "ent:genome_sequencing", "label": "allows discovery of", "title": "\u003cb\u003eallows discovery of\u003c/b\u003e\u003cbr\u003e\u003ci\u003eKnowing about the entire genome will allow researchers to discover future onset diseases and other genetic disorders early.\u003c/i\u003e", "to": "ent:future_onset_diseases"}, {"arrows": "to", "color": "#888888", "from": "ent:genome_sequencing", "label": "allows decisions about", "title": "\u003cb\u003eallows decisions about\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThis will allow for more informed decisions about lifestyle, medication, and having children.\u003c/i\u003e", "to": "ent:lifestyle"}, {"arrows": "to", "color": "#888888", "from": "ent:genome_sequencing", "label": "allows decisions about", "title": "\u003cb\u003eallows decisions about\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThis will allow for more informed decisions about lifestyle, medication, and having children.\u003c/i\u003e", "to": "ent:medication"}, {"arrows": "to", "color": "#888888", "from": "ent:genome_sequencing", "label": "allows decisions about", "title": "\u003cb\u003eallows decisions about\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThis will allow for more informed decisions about lifestyle, medication, and having children.\u003c/i\u003e", "to": "ent:having_children"}, {"arrows": "to", "color": "#888888", "from": "ent:genome_sequencing", "label": "answer", "title": "\u003cb\u003eanswer\u003c/b\u003e\u003cbr\u003e\u003ci\u003eIf you had a chance to get your genome sequenced, what are some questions you might be able to have answered about yourself?\u003c/i\u003e", "to": "ent:questions_about_yourself"}, {"arrows": "to", "color": "#888888", "from": "ent:genome-wide_studies", "label": "can help to find", "title": "\u003cb\u003ecan help to find\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGenome-wide studies can also help to find new genes involved in drug toxicity.\u003c/i\u003e", "to": "ent:new_genes_involved_in_drug_toxicity"}, {"arrows": "to", "color": "#888888", "from": "ent:genome\u2019s", "label": "require both", "title": "\u003cb\u003erequire both\u003c/b\u003e\u003cbr\u003e\u003ci\u003eBoth genetic linkage maps and physical maps are required to build a genome\u2019s\u003c/i\u003e", "to": "ent:genetic_linkage_maps_and_physical_maps"}, {"arrows": "to", "color": "#888888", "from": "ent:genomic_analysis", "label": "has become useful in", "title": "\u003cb\u003ehas become useful in\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGenomic analysis has also become useful in this field.\u003c/i\u003e", "to": "ent:forensic_analysis"}, {"arrows": "to", "color": "#888888", "from": "ent:genomic_dna", "label": "was degraded by", "title": "\u003cb\u003ewas degraded by\u003c/b\u003e\u003cbr\u003e\u003ci\u003eAs a result, it was degraded by nucleases, but still used in the experiment.\u003c/i\u003e", "to": "ent:nucleases"}, {"arrows": "to", "color": "#888888", "from": "ent:genomic_information", "label": "has helped", "title": "\u003cb\u003ehas helped\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThese findings have helped anthropologists to better understand human migration and have aided the medical field through mapping human genetic diseases.\u003c/i\u003e", "to": "ent:anthropologists"}, {"arrows": "to", "color": "#888888", "from": "ent:genomic_information", "label": "has aided", "title": "\u003cb\u003ehas aided\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThese findings have helped anthropologists to better understand human migration and have aided the medical field through mapping human genetic diseases.\u003c/i\u003e", "to": "ent:the_medical_field"}, {"arrows": "to", "color": "#888888", "from": "ent:genomic_library", "label": "is a collection", "title": "\u003cb\u003eis a collection\u003c/b\u003e\u003cbr\u003e\u003ci\u003egenomic library collection of cloned DNA which represents all of the sequences and fragments from a genome\u003c/i\u003e", "to": "ent:cloned_dna"}, {"arrows": "to", "color": "#888888", "from": "ent:genomic_responses", "label": "can be studied using", "title": "\u003cb\u003ecan be studied using\u003c/b\u003e\u003cbr\u003e\u003ci\u003eWe can study genomic responses to drugs using experimental animals (such as laboratory rats or mice) or live cells in the laboratory before embarking on studies with humans.\u003c/i\u003e", "to": "ent:experimental_animals"}, {"arrows": "to", "color": "#888888", "from": "ent:genomic_responses", "label": "can be studied using", "title": "\u003cb\u003ecan be studied using\u003c/b\u003e\u003cbr\u003e\u003ci\u003eWe can study genomic responses to drugs using experimental animals (such as laboratory rats or mice) or live cells in the laboratory before embarking on studies with humans.\u003c/i\u003e", "to": "ent:live_cells"}, {"arrows": "to", "color": "#888888", "from": "ent:genomic-_and_proteomic-scale_analyses", "label": "part of", "title": "\u003cb\u003epart of\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGenomic- and proteomic-scale analyses are part of systems biology, which is the study of whole biological systems (genomes and proteomes) based on interactions within the system.\u003c/i\u003e", "to": "ent:systems_biology"}, {"arrows": "to", "color": "#888888", "from": "ent:genomics", "label": "studies entire genomes", "title": "\u003cb\u003estudies entire genomes\u003c/b\u003e\u003cbr\u003e\u003ci\u003egenomics study of entire genomes including the complete set of genes, their nucleotide sequence and organization, and their interactions within a species and with other species\u003c/i\u003e", "to": "ent:entire_genomes"}, {"arrows": "to", "color": "#888888", "from": "ent:genomics", "label": "includes the study of", "title": "\u003cb\u003eincludes the study of\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGenomics is the study of entire genomes, including the complete set of genes, their nucleotide sequence and organization, and their interactions within a species and with other species.\u003c/i\u003e", "to": "ent:complete_set_of_genes"}, {"arrows": "to", "color": "#888888", "from": "ent:genomics", "label": "includes the study of", "title": "\u003cb\u003eincludes the study of\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGenomics is the study of entire genomes, including the complete set of genes, their nucleotide sequence and organization, and their interactions within a species and with other species.\u003c/i\u003e", "to": "ent:nucleotide_sequence"}, {"arrows": "to", "color": "#888888", "from": "ent:genomics", "label": "includes the study of", "title": "\u003cb\u003eincludes the study of\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGenomics is the study of entire genomes, including the complete set of genes, their nucleotide sequence and organization, and their interactions within a species and with other species.\u003c/i\u003e", "to": "ent:organization_of_genes"}, {"arrows": "to", "color": "#888888", "from": "ent:genomics", "label": "includes the study of", "title": "\u003cb\u003eincludes the study of\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGenomics is the study of entire genomes, including the complete set of genes, their nucleotide sequence and organization, and their interactions within a species and with other species.\u003c/i\u003e", "to": "ent:interactions_within_a_species"}, {"arrows": "to", "color": "#888888", "from": "ent:genomics", "label": "includes the study of", "title": "\u003cb\u003eincludes the study of\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGenomics is the study of entire genomes, including the complete set of genes, their nucleotide sequence and organization, and their interactions within a species and with other species.\u003c/i\u003e", "to": "ent:interactions_with_other_species"}, {"arrows": "to", "color": "#888888", "from": "ent:genomics", "label": "compares the DNA of", "title": "\u003cb\u003ecompares the DNA of\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGenomics compares the DNA of different organisms, enabling scientists to create maps with which to navigate different organisms\u0027 DNA.\u003c/i\u003e", "to": "ent:different_organisms"}, {"arrows": "to", "color": "#888888", "from": "ent:genomics", "label": "can contribute to", "title": "\u003cb\u003ecan contribute to\u003c/b\u003e\u003cbr\u003e\u003ci\u003eIn addition to disease and medicine, genomics can contribute to developing novel enzymes that convert biomass to biofuel, which results in higher crop and fuel production, and lower consumer cost.\u003c/i\u003e", "to": "ent:developing_novel_enzymes"}, {"arrows": "to", "color": "#888888", "from": "ent:genomics", "label": "can improve", "title": "\u003cb\u003ecan improve\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGenomics could also improve monitoring methods that measure the impact of pollutants on ecosystems and help clean up environmental contaminants.\u003c/i\u003e", "to": "ent:monitoring_methods"}, {"arrows": "to", "color": "#888888", "from": "ent:genomics", "label": "has aided in developing", "title": "\u003cb\u003ehas aided in developing\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGenomics has aided in developing agrochemicals and pharmaceuticals that could benefit medical science and agriculture.\u003c/i\u003e", "to": "ent:agrochemicals"}, {"arrows": "to", "color": "#888888", "from": "ent:genomics", "label": "has applications", "title": "\u003cb\u003ehas applications\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGenomics has many industrial applications including biofuel development, agriculture, pharmaceuticals, and pollution control.\u003c/i\u003e", "to": "ent:pharmaceuticals"}, {"arrows": "to", "color": "#888888", "from": "ent:genomics", "label": "could lead to", "title": "\u003cb\u003ecould lead to\u003c/b\u003e\u003cbr\u003e\u003ci\u003eOtherwise, it could be easy to misuse the power of such knowledge, leading to discrimination based on a person\u0027s genetics, human genetic engineering, and other ethical concerns.\u003c/i\u003e", "to": "ent:discrimination_based_on_genetics"}, {"arrows": "to", "color": "#888888", "from": "ent:genomics", "label": "could lead to", "title": "\u003cb\u003ecould lead to\u003c/b\u003e\u003cbr\u003e\u003ci\u003eOtherwise, it could be easy to misuse the power of such knowledge, leading to discrimination based on a person\u0027s genetics, human genetic engineering, and other ethical concerns.\u003c/i\u003e", "to": "ent:human_genetic_engineering"}, {"arrows": "to", "color": "#888888", "from": "ent:genomics", "label": "could lead to", "title": "\u003cb\u003ecould lead to\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThis information could also lead to legal issues regarding health and privacy.\u003c/i\u003e", "to": "ent:legal_issues_regarding_health_and_privacy"}, {"arrows": "to", "color": "#888888", "from": "ent:genomics", "label": "is used in", "title": "\u003cb\u003eis used in\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMany fields, such as metagenomics, pharmacogenomics, and mitochondrial genomics are using genomics.\u003c/i\u003e", "to": "ent:metagenomics"}, {"arrows": "to", "color": "#888888", "from": "ent:genomics", "label": "is used in", "title": "\u003cb\u003eis used in\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMany fields, such as metagenomics, pharmacogenomics, and mitochondrial genomics are using genomics.\u003c/i\u003e", "to": "ent:pharmacogenomics"}, {"arrows": "to", "color": "#888888", "from": "ent:genomics", "label": "is used in", "title": "\u003cb\u003eis used in\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMany fields, such as metagenomics, pharmacogenomics, and mitochondrial genomics are using genomics.\u003c/i\u003e", "to": "ent:mitochondrial_genomics"}, {"arrows": "to", "color": "#888888", "from": "ent:genomics", "label": "is most common in", "title": "\u003cb\u003eis most common in\u003c/b\u003e\u003cbr\u003e\u003ci\u003eUnderstanding and finding cures for diseases is the most common application of genomics.\u003c/i\u003e", "to": "ent:understanding_and_finding_cures_for_diseases"}, {"arrows": "to", "color": "#888888", "from": "ent:genomics", "label": "can reduce", "title": "\u003cb\u003ecan reduce\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGenomics can reduce the trials and failures involved in scientific research to a certain extent, which could improve agricultural crop yield quality and quantity.\u003c/i\u003e", "to": "ent:trials_and_failures"}, {"arrows": "to", "color": "#888888", "from": "ent:genomics", "label": "helps improve", "title": "\u003cb\u003ehelps improve\u003c/b\u003e\u003cbr\u003e\u003ci\u003eLinking traits to genes or gene signatures helps improve crop breeding to generate hybrids with the most desirable qualities.\u003c/i\u003e", "to": "ent:crop_breeding"}, {"arrows": "to", "color": "#888888", "from": "ent:genomics", "label": "has applications", "title": "\u003cb\u003ehas applications\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGenomics has many industrial applications including biofuel development, agriculture, pharmaceuticals, and pollution control.\u003c/i\u003e", "to": "ent:biofuel_development"}, {"arrows": "to", "color": "#888888", "from": "ent:genomics", "label": "has applications", "title": "\u003cb\u003ehas applications\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGenomics has many industrial applications including biofuel development, agriculture, pharmaceuticals, and pollution control.\u003c/i\u003e", "to": "ent:agriculture"}, {"arrows": "to", "color": "#888888", "from": "ent:genomics", "label": "has applications", "title": "\u003cb\u003ehas applications\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGenomics has many industrial applications including biofuel development, agriculture, pharmaceuticals, and pollution control.\u003c/i\u003e", "to": "ent:pollution_control"}, {"arrows": "to", "color": "#888888", "from": "ent:genomics", "label": "predict", "title": "\u003cb\u003epredict\u003c/b\u003e\u003cbr\u003e\u003ci\u003eHow can genomics be used to predict disease risk and treatment options?\u003c/i\u003e", "to": "ent:disease_risk_and_treatment_options"}, {"arrows": "to", "color": "#888888", "from": "ent:gmos", "label": "are created by", "title": "\u003cb\u003eare created by\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGMOs are created by generating genomic DNA fragments with restriction endonucleases\u003c/i\u003e", "to": "ent:generating_genomic_dna_fragments_with_restriction_endonucleases"}, {"arrows": "to", "color": "#888888", "from": "ent:gmos", "label": "are created by", "title": "\u003cb\u003eare created by\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGMOs are created by introducing recombinant DNA into an organism by any means\u003c/i\u003e", "to": "ent:introducing_recombinant_dna_into_an_organism_by_any_means"}, {"arrows": "to", "color": "#888888", "from": "ent:gmos", "label": "are created by", "title": "\u003cb\u003eare created by\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGMOs are created by overexpressing proteins in E. coli\u003c/i\u003e", "to": "ent:overexpressing_proteins_in_e._coli"}, {"arrows": "to", "color": "#888888", "from": "ent:good_gene", "label": "is introduced into", "title": "\u003cb\u003eis introduced into\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe good gene is usually introduced into diseased cells as part of a vector transmitted by a virus that can infect the host cell and deliver the foreign DNA (Figure 17.9).\u003c/i\u003e", "to": "ent:diseased_cells"}, {"arrows": "to", "color": "#888888", "from": "ent:good_gene", "label": "is introduced as part of", "title": "\u003cb\u003eis introduced as part of\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe good gene is usually introduced into diseased cells as part of a vector transmitted by a virus that can infect the host cell and deliver the foreign DNA (Figure 17.9).\u003c/i\u003e", "to": "ent:a_vector"}, {"arrows": "to", "color": "#888888", "from": "ent:government_agencies", "label": "monitor", "title": "\u003cb\u003emonitor\u003c/b\u003e\u003cbr\u003e\u003ci\u003eBecause they are not natural, government agencies closely monitor transgenic plants and other GMOs to ensure that they are fit for human consumption and do not endanger other plant and animal life.\u003c/i\u003e", "to": "ent:transgenic_plants"}, {"arrows": "to", "color": "#888888", "from": "ent:greater_distance_between_two_genes", "label": "leads to higher chance of", "title": "\u003cb\u003eleads to higher chance of\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe greater the distance between two genes, the higher the chance that a recombination event will occur between them, and the higher the recombination frequency between them.\u003c/i\u003e", "to": "ent:recombination_event"}, {"arrows": "to", "color": "#888888", "from": "ent:gregor_mendel", "label": "proposed", "title": "\u003cb\u003eproposed\u003c/b\u003e\u003cbr\u003e\u003ci\u003eShortly after Gregor Mendel (the father of modern genetics) proposed that traits were determined by\u003c/i\u003e", "to": "ent:traits_were_determined_by"}, {"arrows": "to", "color": "#888888", "from": "ent:haploid_egg", "label": "fuses with", "title": "\u003cb\u003efuses with\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSexual reproduction requires two cells. When the haploid egg and sperm cells fuse, a diploid zygote results.\u003c/i\u003e", "to": "ent:sperm_cells"}, {"arrows": "to", "color": "#888888", "from": "ent:hgh_gene", "label": "inserted into", "title": "\u003cb\u003einserted into\u003c/b\u003e\u003cbr\u003e\u003ci\u003eResearchers cloned the HGH gene from a cDNA library and inserted it into E. coli cells by cloning it into a bacterial vector.\u003c/i\u003e", "to": "ent:e._coli_cells"}, {"arrows": "to", "color": "#888888", "from": "ent:high_temperatures", "label": "can separate", "title": "\u003cb\u003ecan separate\u003c/b\u003e\u003cbr\u003e\u003ci\u003eExposure to high temperatures (DNA denaturation) can separate the two strands and cooling can reanneal them.\u003c/i\u003e", "to": "ent:dna_strands"}, {"arrows": "to", "color": "#888888", "from": "ent:hormones", "label": "are examples of", "title": "\u003cb\u003eare examples of\u003c/b\u003e\u003cbr\u003e\u003ci\u003eVaccines, antibiotics, and hormones are examples of products obtained by recombinant DNA technology.\u003c/i\u003e", "to": "ent:products_obtained_by_recombinant_dna_technology"}, {"arrows": "to", "color": "#888888", "from": "ent:host_dna", "label": "is present", "title": "\u003cb\u003eis present\u003c/b\u003e\u003cbr\u003e\u003ci\u003ehost DNA DNA that is present in the genome of the organism of interest\u003c/i\u003e", "to": "ent:the_genome_of_the_organism"}, {"arrows": "to", "color": "#888888", "from": "ent:host_organism", "label": "is transgenic", "title": "\u003cb\u003eis transgenic\u003c/b\u003e\u003cbr\u003e\u003ci\u003eIf the foreign DNA comes from a different species, the host organism is transgenic.\u003c/i\u003e", "to": "ent:foreign_dna_from_different_species"}, {"arrows": "to", "color": "#888888", "from": "ent:human_genome_maps", "label": "help", "title": "\u003cb\u003ehelp\u003c/b\u003e\u003cbr\u003e\u003ci\u003eHuman genome maps help researchers in their efforts to identify human disease-causing genes related to illnesses like cancer, heart disease, and cystic fibrosis.\u003c/i\u003e", "to": "ent:identify_human_disease-causing_genes"}, {"arrows": "to", "color": "#888888", "from": "ent:human_genomic_dna", "label": "is usually visible as", "title": "\u003cb\u003eis usually visible as\u003c/b\u003e\u003cbr\u003e\u003ci\u003eHuman genomic DNA is usually visible as a gelatinous, white mass.\u003c/i\u003e", "to": "ent:gelatinous,_white_mass"}, {"arrows": "to", "color": "#888888", "from": "ent:human_insulin", "label": "produced in", "title": "\u003cb\u003eproduced
