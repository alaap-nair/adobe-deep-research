in\u003c/b\u003e\u003cbr\u003e\u003ci\u003eScientists used recombinant DNA technology to produce large-scale quantities of human insulin in E. coli as early as 1978.\u003c/i\u003e", "to": "ent:e._coli"}, {"arrows": "to", "color": "#888888", "from": "ent:human_proteome_organization_(hupo)", "label": "developing and establishing", "title": "\u003cb\u003edeveloping and establishing\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe European Bioinformatics Institute and the Human Proteome Organization (HUPO) are developing and establishing effective tools to sort through the enormous pile of systems biology data.\u003c/i\u003e", "to": "ent:effective_tools"}, {"arrows": "to", "color": "#888888", "from": "ent:individual_protein", "label": "is", "title": "\u003cb\u003eis\u003c/b\u003e\u003cbr\u003e\u003ci\u003eAn individual protein is a biomarker; whereas, a set of proteins with altered expression levels is a protein signature.\u003c/i\u003e", "to": "ent:biomarker"}, {"arrows": "to", "color": "#888888", "from": "ent:individual\u2019s_dna", "label": "gives rise to", "title": "\u003cb\u003egives rise to\u003c/b\u003e\u003cbr\u003e\u003ci\u003eEvery individual\u2019s DNA will give rise to a unique pattern of bands when cut with a particular set of restriction endonucleases.\u003c/i\u003e", "to": "ent:unique_pattern_of_bands"}, {"arrows": "to", "color": "#888888", "from": "ent:information", "label": "is used in", "title": "\u003cb\u003eis used in\u003c/b\u003e\u003cbr\u003e\u003ci\u003eInformation obtained by microscopic analysis of stained chromosomes is used in: d. cytogenetic mapping\u003c/i\u003e", "to": "ent:cytogenetic_mapping"}, {"arrows": "to", "color": "#888888", "from": "ent:insects", "label": "ingest Bt toxin", "title": "\u003cb\u003eingest Bt toxin\u003c/b\u003e\u003cbr\u003e\u003ci\u003eInsects need to ingest Bt toxin in order to activate the toxin.\u003c/i\u003e", "to": "ent:activate_the_toxin"}, {"arrows": "to", "color": "#888888", "from": "ent:insects", "label": "stop feeding", "title": "\u003cb\u003estop feeding\u003c/b\u003e\u003cbr\u003e\u003ci\u003eInsects that have eaten Bt toxin stop feeding on the plants within a few hours.\u003c/i\u003e", "to": "ent:plants"}, {"arrows": "to", "color": "#888888", "from": "ent:insulin", "label": "is produced by", "title": "\u003cb\u003eis produced by\u003c/b\u003e\u003cbr\u003e\u003ci\u003eInsulin produced by molecular cloning:\u003c/i\u003e", "to": "ent:molecular_cloning"}, {"arrows": "to", "color": "#888888", "from": "ent:insulin", "label": "is a", "title": "\u003cb\u003eis a\u003c/b\u003e\u003cbr\u003e\u003ci\u003eis a recombinant protein\u003c/i\u003e", "to": "ent:recombinant_protein"}, {"arrows": "to", "color": "#888888", "from": "ent:larger_sequence", "label": "is assembled from", "title": "\u003cb\u003eis assembled from\u003c/b\u003e\u003cbr\u003e\u003ci\u003eA larger sequence that is assembled from overlapping shorter sequences is called a contig.\u003c/i\u003e", "to": "ent:overlapping_shorter_sequences"}, {"arrows": "to", "color": "#888888", "from": "ent:linkage_analysis", "label": "analyzes", "title": "\u003cb\u003eanalyzes\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe study of genetic maps begins with linkage analysis, a procedure that analyzes the recombination frequency between genes to determine if they are linked or show independent assortment.\u003c/i\u003e", "to": "ent:recombination_frequency_between_genes"}, {"arrows": "to", "color": "#888888", "from": "ent:linkage_analysis", "label": "determine", "title": "\u003cb\u003edetermine\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe study of genetic maps begins with linkage analysis, a procedure that analyzes the recombination frequency between genes to determine if they are linked or show independent assortment.\u003c/i\u003e", "to": "ent:if_genes_are_linked_or_show_independent_assortment"}, {"arrows": "to", "color": "#888888", "from": "ent:linkage_analysis", "label": "involves studying", "title": "\u003cb\u003einvolves studying\u003c/b\u003e\u003cbr\u003e\u003ci\u003eLinkage analysis involves studying the recombination frequency between any two genes.\u003c/i\u003e", "to": "ent:the_recombination_frequency_between_any_two_genes"}, {"arrows": "to", "color": "#888888", "from": "ent:linkage_analysis", "label": "analyzes recombining genes", "title": "\u003cb\u003eanalyzes recombining genes\u003c/b\u003e\u003cbr\u003e\u003ci\u003elinkage analysis procedure that analyzes recombining genes to determine if they are linked\u003c/i\u003e", "to": "ent:recombining_genes"}, {"arrows": "to", "color": "#888888", "from": "ent:linkage_analysis", "label": "is based on", "title": "\u003cb\u003eis based on\u003c/b\u003e\u003cbr\u003e\u003ci\u003eis based on the natural recombination process\u003c/i\u003e", "to": "ent:the_natural_recombination_process"}, {"arrows": "to", "color": "#888888", "from": "ent:lysis_buffer", "label": "breaks", "title": "\u003cb\u003ebreaks\u003c/b\u003e\u003cbr\u003e\u003ci\u003eA lysis buffer (a solution which is mostly a detergent) breaks cells.\u003c/i\u003e", "to": "ent:cells"}, {"arrows": "to", "color": "#888888", "from": "ent:lysis_buffer", "label": "breaks the cell membrane", "title": "\u003cb\u003ebreaks the cell membrane\u003c/b\u003e\u003cbr\u003e\u003ci\u003elysis buffer solution to break the cell membrane and release cell contents\u003c/i\u003e", "to": "ent:the_cell_membrane"}, {"arrows": "to", "color": "#888888", "from": "ent:manipulating_the_dna_of_plants", "label": "helped to create", "title": "\u003cb\u003ehelped to create\u003c/b\u003e\u003cbr\u003e\u003ci\u003eManipulating the DNA of plants (i.e., creating GMOs) has helped to create desirable traits, such as disease resistance, herbicide and pesticide resistance, better nutritional value, and better shelf-life (Figure 17.10).\u003c/i\u003e", "to": "ent:desirable_traits"}, {"arrows": "to", "color": "#888888", "from": "ent:mapping_information", "label": "goes into", "title": "\u003cb\u003egoes into\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMapping information generated in laboratories all over the world goes into central databases, such as GenBank at the National Center for Biotechnology Information (NCBI).\u003c/i\u003e", "to": "ent:central_databases"}, {"arrows": "to", "color": "#888888", "from": "ent:mass_spectrometry", "label": "identifies", "title": "\u003cb\u003eidentifies\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe basic technique for protein analysis, analogous to DNA sequencing, is mass spectrometry. Mass spectrometry identifies and determines a molecule\u0027s characteristics.\u003c/i\u003e", "to": "ent:molecule\u0027s_characteristics"}, {"arrows": "to", "color": "#888888", "from": "ent:mass_spectrometry", "label": "is good for", "title": "\u003cb\u003eis good for\u003c/b\u003e\u003cbr\u003e\u003ci\u003eAlthough mass spectrometry is good for detecting small protein amounts, variations in protein expression in diseased states can be difficult to discern.\u003c/i\u003e", "to": "ent:detecting_small_protein_amounts"}, {"arrows": "to", "color": "#888888", "from": "ent:medical_field", "label": "has used", "title": "\u003cb\u003ehas used\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe medical field has used genes cloned from the influenza virus to combat the constantly changing strains of this virus.\u003c/i\u003e", "to": "ent:genes_cloned_from_the_influenza_virus"}, {"arrows": "to", "color": "#888888", "from": "ent:medical_professionals", "label": "can use", "title": "\u003cb\u003ecan use\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMedical professionals can use personal genome sequence information to prescribe medications that will be most effective and least toxic on the basis of the individual patient\u2019s genotype.\u003c/i\u003e", "to": "ent:personal_genome_sequence_information"}, {"arrows": "to", "color": "#888888", "from": "ent:medical_professionals", "label": "can prescribe", "title": "\u003cb\u003ecan prescribe\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMedical professionals can use personal genome sequence information to prescribe medications that will be most effective and least toxic on the basis of the individual patient\u2019s genotype.\u003c/i\u003e", "to": "ent:medications"}, {"arrows": "to", "color": "#888888", "from": "ent:medical_professionals", "label": "perform", "title": "\u003cb\u003eperform\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMedical professionals perform genetic testing to identify disease-causing genes, and use gene therapy to cure an inheritable disease.\u003c/i\u003e", "to": "ent:genetic_testing"}, {"arrows": "to", "color": "#888888", "from": "ent:medical_professionals", "label": "use", "title": "\u003cb\u003euse\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMedical professionals perform genetic testing to identify disease-causing genes, and use gene therapy to cure an inheritable disease.\u003c/i\u003e", "to": "ent:gene_therapy"}, {"arrows": "to", "color": "#888888", "from": "ent:medical_professionals", "label": "use", "title": "\u003cb\u003euse\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMedical professionals are using different biomarkers and protein signatures to analyze each cancer type.\u003c/i\u003e", "to": "ent:different_biomarkers_and_protein_signatures"}, {"arrows": "to", "color": "#888888", "from": "ent:metabolome", "label": "is a set", "title": "\u003cb\u003eis a set\u003c/b\u003e\u003cbr\u003e\u003ci\u003emetabolome complete set of metabolites which are related to an organism\u0027s genetic makeup\u003c/i\u003e", "to": "ent:metabolites"}, {"arrows": "to", "color": "#888888", "from": "ent:metabolomics", "label": "studies small molecule metabolites", "title": "\u003cb\u003estudies small molecule metabolites\u003c/b\u003e\u003cbr\u003e\u003ci\u003emetabolomics study of small molecule metabolites in an organism\u003c/i\u003e", "to": "ent:small_molecule_metabolites"}, {"arrows": "to", "color": "#888888", "from": "ent:metagenomics", "label": "is the study of", "title": "\u003cb\u003eis the study of\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMetagenomics is the study of the collective genomes of multiple species that grow and interact in an environmental niche.\u003c/i\u003e", "to": "ent:the_collective_genomes_of_multiple_species"}, {"arrows": "to", "color": "#888888", "from": "ent:metagenomics", "label": "can be used to", "title": "\u003cb\u003ecan be used to\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMetagenomics can be used to identify new species more rapidly and to analyze the effect of pollutants on the environment (Figure 17.16).\u003c/i\u003e", "to": "ent:identify_new_species"}, {"arrows": "to", "color": "#888888", "from": "ent:metagenomics", "label": "can be used to", "title": "\u003cb\u003ecan be used to\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMetagenomics can be used to identify new species more rapidly and to analyze the effect of pollutants on the environment (Figure 17.16).\u003c/i\u003e", "to": "ent:analyze_the_effect_of_pollutants"}, {"arrows": "to", "color": "#888888", "from": "ent:metagenomics", "label": "involves isolating", "title": "\u003cb\u003einvolves isolating\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMetagenomics involves isolating DNA from multiple species within an environmental niche.\u003c/i\u003e", "to": "ent:dna"}, {"arrows": "to", "color": "#888888", "from": "ent:metagenomics", "label": "studies multiple species\u0027 collective genomes", "title": "\u003cb\u003estudies multiple species\u0027 collective genomes\u003c/b\u003e\u003cbr\u003e\u003ci\u003emetagenomics study of multiple species\u0027 collective genomes that grow and interact in an environmental niche\u003c/i\u003e", "to": "ent:multiple_species\u0027_collective_genomes"}, {"arrows": "to", "color": "#888888", "from": "ent:metagenomics", "label": "be", "title": "\u003cb\u003ebe\u003c/b\u003e\u003cbr\u003e\u003ci\u003eExplain why metagenomics is probably the most revolutionary application of genomics.\u003c/i\u003e", "to": "ent:revolutionary_application_of_genomics"}, {"arrows": "to", "color": "#888888", "from": "ent:microarrays", "label": "discover", "title": "\u003cb\u003ediscover\u003c/b\u003e\u003cbr\u003e\u003ci\u003eWe can discover almost one million genotypic abnormalities using microarrays; whereas, whole-genome sequencing can provide information 460 17 \u2022 Biotechnology and Genomics Access for free at openstax.org\u003c/i\u003e", "to": "ent:one_million_genotypic_abnormalities"}, {"arrows": "to", "color": "#888888", "from": "ent:microbial_genomics", "label": "is used to find", "title": "\u003cb\u003eis used to find\u003c/b\u003e\u003cbr\u003e\u003ci\u003eKnowledge of the genomics of microorganisms is being used to find better ways to harness biofuels from algae and cyanobacteria.\u003c/i\u003e", "to": "ent:better_ways_to_harness_biofuels"}, {"arrows": "to", "color": "#888888", "from": "ent:microbial_genomics", "label": "is helping to develop", "title": "\u003cb\u003eis helping to develop\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMicrobial genomics is helping to develop diagnostic tools, improved vaccines, new disease treatments, and advanced environmental cleanup techniques.\u003c/i\u003e", "to": "ent:diagnostic_tools"}, {"arrows": "to", "color": "#888888", "from": "ent:microbial_genomics", "label": "is helping to develop", "title": "\u003cb\u003eis helping to develop\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMicrobial genomics is helping to develop diagnostic tools, improved vaccines, new disease treatments, and advanced environmental cleanup techniques.\u003c/i\u003e", "to": "ent:improved_vaccines"}, {"arrows": "to", "color": "#888888", "from": "ent:microbial_genomics", "label": "is helping to develop", "title": "\u003cb\u003eis helping to develop\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMicrobial genomics is helping to develop diagnostic tools, improved vaccines, new disease treatments, and advanced environmental cleanup techniques.\u003c/i\u003e", "to": "ent:new_disease_treatments"}, {"arrows": "to", "color": "#888888", "from": "ent:microbial_genomics", "label": "is helping to develop", "title": "\u003cb\u003eis helping to develop\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMicrobial genomics is helping to develop diagnostic tools, improved vaccines, new disease treatments, and advanced environmental cleanup techniques.\u003c/i\u003e", "to": "ent:advanced_environmental_cleanup_techniques"}, {"arrows": "to", "color": "#888888", "from": "ent:microbial_world", "label": "is a resource for", "title": "\u003cb\u003eis a resource for\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe microbial world is one of the largest resources for genes that encode new enzymes and produce new organic compounds, and it remains largely untapped.\u003c/i\u003e", "to": "ent:genes_that_encode_new_enzymes"}, {"arrows": "to", "color": "#888888", "from": "ent:microbial_world", "label": "is a resource for", "title": "\u003cb\u003eis a resource for\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe microbial world is one of the largest resources for genes that encode new enzymes and produce new organic compounds, and it remains largely untapped.\u003c/i\u003e", "to": "ent:new_organic_compounds"}, {"arrows": "to", "color": "#888888", "from": "ent:microbiology", "label": "traditionally taught", "title": "\u003cb\u003etraditionally taught\u003c/b\u003e\u003cbr\u003e\u003ci\u003eTraditionally, scholars have taught microbiology with the view that it is best to study microorganisms under pure culture conditions.\u003c/i\u003e", "to": "ent:study_microorganisms_under_pure_culture_conditions"}, {"arrows": "to", "color": "#888888", "from": "ent:microorganisms", "label": "naturally produce", "title": "\u003cb\u003enaturally produce\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMicroorganisms, such as fungi, naturally produce them to attain an advantage over bacterial populations.\u003c/i\u003e", "to": "ent:antibiotics"}, {"arrows": "to", "color": "#888888", "from": "ent:microorganisms", "label": "can go through", "title": "\u003cb\u003ecan go through\u003c/b\u003e\u003cbr\u003e\u003ci\u003eBecause microorganisms can go through several generations in a matter of hours, their gene expression profiles adapt to the new laboratory environment very quickly.\u003c/i\u003e", "to": "ent:several_generations"}, {"arrows": "to", "color": "#888888", "from": "ent:microorganisms", "label": "resist culturing", "title": "\u003cb\u003eresist culturing\u003c/b\u003e\u003cbr\u003e\u003ci\u003eIn addition, the vast majority of bacterial species resist culturing in isolation.\u003c/i\u003e", "to": "ent:in_isolation"}, {"arrows": "to", "color": "#888888", "from": "ent:microorganisms", "label": "are used to create", "title": "\u003cb\u003eare used to create\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMicroorganisms are used to create products, such as enzymes that are used in research, antibiotics, and other antimicrobial mechanisms.\u003c/i\u003e", "to": "ent:products"}, {"arrows": "to", "color": "#888888", "from": "ent:microsatellite_polymorphism", "label": "varies between individuals", "title": "\u003cb\u003evaries between individuals\u003c/b\u003e\u003cbr\u003e\u003ci\u003emicrosatellite polymorphism variation between individuals in the sequence and number of microsatellite DNA repeats\u003c/i\u003e", "to": "ent:individuals"}, {"arrows": "to", "color": "#888888", "from": "ent:microsatellite_polymorphisms", "label": "are similar to", "title": "\u003cb\u003eare similar to\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMicrosatellite polymorphisms are similar to VNTRs, but the repeat unit is very small.\u003c/i\u003e", "to": "ent:vntrs"}, {"arrows": "to", "color": "#888888", "from": "ent:mitochondria", "label": "contain", "title": "\u003cb\u003econtain\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMitochondria are intracellular organelles that contain their own DNA.\u003c/i\u003e", "to": "ent:their_own_dna"}, {"arrows": "to", "color": "#888888", "from": "ent:mitochondrial_dna", "label": "mutates at", "title": "\u003cb\u003emutates at\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMitochondrial DNA mutates at a rapid rate and scientists often use it to study evolutionary relationships.\u003c/i\u003e", "to": "ent:a_rapid_rate"}, {"arrows": "to", "color": "#888888", "from": "ent:mitochondrial_dna", "label": "passes from", "title": "\u003cb\u003epasses from\u003c/b\u003e\u003cbr\u003e\u003ci\u003eAnother feature that makes studying the mitochondrial genome interesting is that the mitochondrial DNA in most multicellular organisms passes from the mother during the fertilization process.\u003c/i\u003e", "to": "ent:the_mother"}, {"arrows": "to", "color": "#888888", "from": "ent:model_organism", "label": "is studied by researchers", "title": "\u003cb\u003eis studied by researchers\u003c/b\u003e\u003cbr\u003e\u003ci\u003emodel organism species that researchers study and use as a model to understand the biological processes in other species represented by the model organism\u003c/i\u003e", "to": "ent:researchers"}, {"arrows": "to", "color": "#888888", "from": "ent:model_organisms", "label": "include", "title": "\u003cb\u003einclude\u003c/b\u003e\u003cbr\u003e\u003ci\u003eWe now know the genomes of other model organisms, such as the mouse Mus musculus, the fruit fly Drosophila melanogaster, the nematode Caenorhabditis elegans, and humans Homo sapiens.\u003c/i\u003e", "to": "ent:mouse_mus_musculus,_the_fruit_fly_drosophila_melanogaster,_the_nematode_caenorhabditis_elegans,_and_humans_homo_sapiens"}, {"arrows": "to", "color": "#888888", "from": "ent:modern_biotechnology", "label": "allows plants to encode", "title": "\u003cb\u003eallows plants to encode\u003c/b\u003e\u003cbr\u003e\u003ci\u003eModern biotechnology has allowed plants to encode their own crystal Bt toxin that acts against insects.\u003c/i\u003e", "to": "ent:own_crystal_bt_toxin"}, {"arrows": "to", "color": "#888888", "from": "ent:modern_techniques", "label": "start at", "title": "\u003cb\u003estart at\u003c/b\u003e\u003cbr\u003e\u003ci\u003eAlthough classical methods of studying gene function began with a given phenotype and determined the genetic basis of that phenotype, modern techniques allow researchers to start at the DNA sequence level and ask: \"What does this gene or DNA element do?\"\u003c/i\u003e", "to": "ent:dna_sequence_level"}, {"arrows": "to", "color": "#888888", "from": "ent:modern_techniques", "label": "use", "title": "\u003cb\u003euse\u003c/b\u003e\u003cbr\u003e\u003ci\u003eModern techniques use the genes of microorganisms cloned into vectors to mass produce the desired antigen.\u003c/i\u003e", "to": "ent:genes_of_microorganisms_cloned_into_vectors"}, {"arrows": "to", "color": "#888888", "from": "ent:modern-day_sequencing_strategies", "label": "involves", "title": "\u003cb\u003einvolves\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe basic principle of all modern-day sequencing strategies involves the chain termination method of sequencing.\u003c/i\u003e", "to": "ent:chain_termination_method"}, {"arrows": "to", "color": "#888888", "from": "ent:molecular_cloning", "label": "refers to", "title": "\u003cb\u003erefers to\u003c/b\u003e\u003cbr\u003e\u003ci\u003eIn general, the word \u201ccloning\u201d means the creation of a perfect replica; however, in biology, the re-creation of a whole organism is referred to as \u201creproductive cloning.\u201d\u003c/i\u003e", "to": "ent:reproductive_cloning"}, {"arrows": "to", "color": "#888888", "from": "ent:molecular_cloning", "label": "allows", "title": "\u003cb\u003eallows\u003c/b\u003e\u003cbr\u003e\u003ci\u003eCloning small genome fragments allows researchers to manipulate and study specific genes (and their protein products), or noncoding regions in isolation.\u003c/i\u003e", "to": "ent:researchers_to_manipulate_and_study_specific_genes"}, {"arrows": "to", "color": "#888888", "from": "ent:molecular_cloning", "label": "clones DNA fragments", "title": "\u003cb\u003eclones DNA fragments\u003c/b\u003e\u003cbr\u003e\u003ci\u003emolecular cloning cloning of DNA fragments\u003c/i\u003e", "to": "ent:dna_fragments"}, {"arrows": "to", "color": "#888888", "from": "ent:most_microorganisms", "label": "do not live as", "title": "\u003cb\u003edo not live as\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMost microorganisms do not live as isolated entities, but in microbial communities or biofilms.\u003c/i\u003e", "to": "ent:isolated_entities"}, {"arrows": "to", "color": "#888888", "from": "ent:multicellular_organisms", "label": "undergo reproduction by", "title": "\u003cb\u003eundergo reproduction by\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMost multicellular organisms undergo reproduction by sexual means, which involves genetic hybridization of two individuals (parents), making it impossible to generate an identical copy or a clone of either parent.\u003c/i\u003e", "to": "ent:sexual_means"}, {"arrows": "to", "color": "#888888", "from": "ent:multiple_cloning_site", "label": "contains", "title": "\u003cb\u003econtains\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe MCS is a short DNA sequence containing multiple sites that different commonly available restriction endonucleases can cut.\u003c/i\u003e", "to": "ent:multiple_sites"}, {"arrows": "to", "color": "#888888", "from": "ent:multiple_cloning_site_(mcs)", "label": "recognizes multiple restriction endonucleases", "title": "\u003cb\u003erecognizes multiple restriction endonucleases\u003c/b\u003e\u003cbr\u003e\u003ci\u003emultiple cloning site (MCS) site that multiple restriction endonucleases can recognize\u003c/i\u003e", "to": "ent:multiple_restriction_endonucleases"}, {"arrows": "to", "color": "#888888", "from": "ent:national_cancer_institute", "label": "has developed", "title": "\u003cb\u003ehas developed\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe National Cancer Institute has developed programs to improve cancer detection and treatment.\u003c/i\u003e", "to": "ent:programs_to_improve_cancer_detection_and_treatment"}, {"arrows": "to", "color": "#888888", "from": "ent:ncbi", "label": "has created", "title": "\u003cb\u003ehas created\u003c/b\u003e\u003cbr\u003e\u003ci\u003eNCBI has created a genome viewer tool to simplify the data-mining process.\u003c/i\u003e", "to": "ent:a_genome_viewer_tool"}, {"arrows": "to", "color": "#888888", "from": "ent:next-generation_sequencing", "label": "is a group of", "title": "\u003cb\u003eis a group of\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSince 2005, automated sequencing techniques used by laboratories are under the umbrella of next-generation sequencing (deep sequencing or massively parallel sequencing), which is a group of automated techniques used for rapid DNA sequencing.\u003c/i\u003e", "to": "ent:automated_techniques"}, {"arrows": "to", "color": "#888888", "from": "ent:next-generation_sequencing", "label": "used for", "title": "\u003cb\u003eused for\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSince 2005, automated sequencing techniques used by laboratories are under the umbrella of next-generation sequencing (deep sequencing or massively parallel sequencing), which is a group of automated techniques used for rapid DNA sequencing.\u003c/i\u003e", "to": "ent:rapid_dna_sequencing"}, {"arrows": "to", "color": "#888888", "from": "ent:next-generation_sequencing", "label": "can generate", "title": "\u003cb\u003ecan generate\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThese automated low-cost sequencers can generate sequences of hundreds of thousands or millions of short fragments (25 to 500 base pairs) in the span of one day.\u003c/i\u003e", "to": "ent:sequences_of_hundreds_of_thousands_or_millions_of_short_fragments"}, {"arrows": "to", "color": "#888888", "from": "ent:next-generation_sequencing", "label": "use", "title": "\u003cb\u003euse\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThese sequencers use sophisticated software to get through the cumbersome process of putting all the fragments in order.\u003c/i\u003e", "to": "ent:sophisticated_software"}, {"arrows": "to", "color": "#888888", "from": "ent:non-coding_dna", "label": "has no known biological function", "title": "\u003cb\u003ehas no known biological function\u003c/b\u003e\u003cbr\u003e\u003ci\u003eNon-coding, or \u201cjunk,\u201d DNA has no known biological function; however, research shows that much of this DNA is actually transcribed.\u003c/i\u003e", "to": "ent:research_shows_that_much_of_this_dna_is_actually_transcribed"}, {"arrows": "to", "color": "#888888", "from": "ent:northern_blots", "label": "detect", "title": "\u003cb\u003edetect\u003c/b\u003e\u003cbr\u003e\u003ci\u003eScientists use Southern blots to detect the presence of certain DNA sequences in a given genome, and Northern blots to detect gene expression.\u003c/i\u003e", "to": "ent:gene_expression"}, {"arrows": "to", "color": "#888888", "from": "ent:northern_blotting", "label": "transfer", "title": "\u003cb\u003etransfer\u003c/b\u003e\u003cbr\u003e\u003ci\u003eWhen they transfer the RNA to a nylon membrane, they call it Northern blotting.\u003c/i\u003e", "to": "ent:rna"}, {"arrows": "to", "color": "#888888", "from": "ent:northern_blotting", "label": "involves", "title": "\u003cb\u003einvolves\u003c/b\u003e\u003cbr\u003e\u003ci\u003eNorthern blotting transfer of RNA from a gel to a nylon membrane\u003c/i\u003e", "to": "ent:transfer_of_rna"}, {"arrows": "to", "color": "#888888", "from": "ent:northern_blotting", "label": "involves", "title": "\u003cb\u003einvolves\u003c/b\u003e\u003cbr\u003e\u003ci\u003eNorthern blotting transfer of RNA from a gel to a nylon membrane\u003c/i\u003e", "to": "ent:a_nylon_membrane"}, {"arrows": "to", "color": "#888888", "from": "ent:novel_enzymes", "label": "convert", "title": "\u003cb\u003econvert\u003c/b\u003e\u003cbr\u003e\u003ci\u003eIn addition to disease and medicine, genomics can contribute to developing novel enzymes that convert biomass to biofuel, which results in higher crop and fuel production, and lower consumer cost.\u003c/i\u003e", "to": "ent:biomass_to_biofuel"}, {"arrows": "to", "color": "#888888", "from": "ent:nuclear_dna", "label": "duplicates by", "title": "\u003cb\u003eduplicates by\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe nuclear DNA duplicates by the process of mitosis, which creates an exact replica of the genetic material.\u003c/i\u003e", "to": "ent:mitosis"}, {"arrows": "to", "color": "#888888", "from": "ent:nuclear_magnetic_resonance_(nmr)", "label": "uses", "title": "\u003cb\u003euses\u003c/b\u003e\u003cbr\u003e\u003ci\u003eAnother protein imaging technique, nuclear magnetic resonance (NMR), uses atoms\u0027 magnetic properties to determine the protein\u0027s three- dimensional structure in\u003c/i\u003e", "to": "ent:atoms\u0027_magnetic_properties"}, {"arrows": "to", "color": "#888888", "from": "ent:nucleic_acids", "label": "are made of", "title": "\u003cb\u003eare made of\u003c/b\u003e\u003cbr\u003e\u003ci\u003eTo understand the basic techniques used to work with nucleic acids, remember that nucleic acids are macromolecules made of nucleotides (a sugar, a phosphate, and a nitrogenous base) linked by phosphodiester bonds.\u003c/i\u003e", "to": "ent:nucleotides"}, {"arrows": "to", "color": "#888888", "from": "ent:nucleic_acids", "label": "load into", "title": "\u003cb\u003eload into\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe nucleic acids load into a slot near the semisolid, porous gel matrix\u0027s negative electrode, and pulled toward the positive electrode at the gel\u0027s opposite end.\u003c/i\u003e", "to": "ent:gel_matrix"}, {"arrows": "to", "color": "#888888", "from": "ent:nucleic_acids", "label": "can be isolated from", "title": "\u003cb\u003ecan be isolated from\u003c/b\u003e\u003cbr\u003e\u003ci\u003eNucleic acids can be isolated from cells for the purposes of further analysis by breaking open the cells and enzymatically destroying all other major macromolecules.\u003c/i\u003e", "to": "ent:cells"}, {"arrows": "to", "color": "#888888", "from": "ent:online_mendelian_inheritance_in_man_(omim)", "label": "is a catalog of", "title": "\u003cb\u003eis a catalog of\u003c/b\u003e\u003cbr\u003e\u003ci\u003eOnline Mendelian Inheritance in Man (OMIM) is a searchable online catalog of human genes and genetic disorders.\u003c/i\u003e", "to": "ent:human_genes_and_genetic_disorders"}, {"arrows": "to", "color": "#888888", "from": "ent:online_mendelian_inheritance_in_man_(omim)", "label": "shows information about", "title": "\u003cb\u003eshows information about\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThis website shows genome mapping information, and also details the history and research of each trait and disorder.\u003c/i\u003e", "to": "ent:genome_mapping"}, {"arrows": "to", "color": "#888888", "from": "ent:online_mendelian_inheritance_in_man_(omim)", "label": "details history and research of", "title": "\u003cb\u003edetails history and research of\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThis website shows genome mapping information, and also details the history and research of each trait and disorder.\u003c/i\u003e", "to": "ent:trait_and_disorder"}, {"arrows": "to", "color": "#888888", "from": "ent:organism", "label": "receives recombinant DNA", "title": "\u003cb\u003ereceives recombinant DNA\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe organism that receives the recombinant DNA is a genetically modified organism (GMO).\u003c/i\u003e", "to": "ent:genetically_modified_organism_(gmo)"}, {"arrows": "to", "color": "#888888", "from": "ent:organisms", "label": "produce", "title": "\u003cb\u003eproduce\u003c/b\u003e\u003cbr\u003e\u003ci\u003eFungi, bacteria, and other organisms that have antimicrobial properties produce antibiotics.\u003c/i\u003e", "to": "ent:antibiotics"}, {"arrows": "to", "color": "#888888", "from": "ent:pairwise-end_sequencing", "label": "analyzes", "title": "\u003cb\u003eanalyzes\u003c/b\u003e\u003cbr\u003e\u003ci\u003eIn pairwise-end sequencing, scientists analyze each fragment\u2019s end for overlap.\u003c/i\u003e", "to": "ent:each_fragment\u2019s_end"}, {"arrows": "to", "color": "#888888", "from": "ent:pairwise-end_sequencing", "label": "is more cumbersome than", "title": "\u003cb\u003eis more cumbersome than\u003c/b\u003e\u003cbr\u003e\u003ci\u003ePairwise-end sequencing is, therefore, more cumbersome than shotgun sequencing, but it is easier to reconstruct the sequence because there is more available information.\u003c/i\u003e", "to": "ent:shotgun_sequencing"}, {"arrows": "to", "color": "#888888", "from": "ent:parthenogenesis", "label": "occurs when", "title": "\u003cb\u003eoccurs when\u003c/b\u003e\u003cbr\u003e\u003ci\u003eParthenogenesis, or \u201cvirgin birth,\u201d occurs when an embryo grows and develops without egg fertilization.\u003c/i\u003e", "to": "ent:an_embryo_grows_without_fertilization"}, {"arrows": "to", "color": "#888888", "from": "ent:pca3", "label": "is expressed in", "title": "\u003cb\u003eis expressed in\u003c/b\u003e\u003cbr\u003e\u003ci\u003ePCA3 is a gene that is expressed in prostate epithelial cells and overexpressed in cancerous cells.\u003c/i\u003e", "to": "ent:prostate_epithelial_cells"}, {"arrows": "to", "color": "#888888", "from": "ent:pca3", "label": "is overexpressed in", "title": "\u003cb\u003eis overexpressed in\u003c/b\u003e\u003cbr\u003e\u003ci\u003ePCA3 is a gene that is expressed in prostate epithelial cells and overexpressed in cancerous cells.\u003c/i\u003e", "to": "ent:cancerous_cells"}, {"arrows": "to", "color": "#888888", "from": "ent:pca3_concentration", "label": "is indicative of", "title": "\u003cb\u003eis indicative of\u003c/b\u003e\u003cbr\u003e\u003ci\u003eA high PCA3 concentration in urine is indicative of prostate cancer.\u003c/i\u003e", "to": "ent:prostate_cancer"}, {"arrows": "to", "color": "#888888", "from": "ent:pca3_test", "label": "is a better indicator of", "title": "\u003cb\u003eis a better indicator of\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe PCA3 test is a better indicator of cancer than the more well known PSA test, which measures the level of PSA (prostate-specific antigen) in the blood.\u003c/i\u003e", "to": "ent:cancer"}, {"arrows": "to", "color": "#888888", "from": "ent:pca3_test", "label": "is more accurate", "title": "\u003cb\u003eis more accurate\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe PCA3 test is more accurate, but screening may still result in people who would not have been harmed by the cancer itself suffering side effects from treatment.\u003c/i\u003e", "to": "ent:psa_test"}, {"arrows": "to", "color": "#888888", "from": "ent:pcr", "label": "amplifies", "title": "\u003cb\u003eamplifies\u003c/b\u003e\u003cbr\u003e\u003ci\u003ePolymerase chain reaction (PCR) is a technique that scientists use to amplify specific DNA regions for further analysis.\u003c/i\u003e", "to": "ent:specific_dna_regions"}, {"arrows": "to", "color": "#888888", "from": "ent:pcr", "label": "can amplify", "title": "\u003cb\u003ecan amplify\u003c/b\u003e\u003cbr\u003e\u003ci\u003ePCR can amplify short DNA or RNA stretches.\u003c/i\u003e", "to": "ent:short_dna_or_rna_stretches"}, {"arrows": "to", "color": "#888888", "from": "ent:pharmaceutical_companies", "label": "produce and test", "title": "\u003cb\u003eproduce and test\u003c/b\u003e\u003cbr\u003e\u003ci\u003ePharmaceutical companies now commercially produce and test antibiotics for their potential to inhibit bacterial growth.\u003c/i\u003e", "to": "ent:antibiotics"}, {"arrows": "to", "color": "#888888", "from": "ent:pharmacogenomics", "label": "involves evaluating", "title": "\u003cb\u003einvolves evaluating\u003c/b\u003e\u003cbr\u003e\u003ci\u003ePharmacogenomics, or toxicogenomics, involves evaluating drug effectiveness and safety on the basis of information from an individual\u0027s genomic sequence.\u003c/i\u003e", "to": "ent:drug_effectiveness_and_safety"}, {"arrows": "to", "color": "#888888", "from": "ent:pharmacogenomics", "label": "uses information from", "title": "\u003cb\u003euses information from\u003c/b\u003e\u003cbr\u003e\u003ci\u003ePharmacogenomics, or toxicogenomics, involves evaluating drug effectiveness and safety on the basis of information from an individual\u0027s genomic sequence.\u003c/i\u003e", "to": "ent:an_individual\u0027s_genomic_sequence"}, {"arrows": "to", "color": "#888888", "from": "ent:pharmacogenomics", "label": "studies", "title": "\u003cb\u003estudies\u003c/b\u003e\u003cbr\u003e\u003ci\u003epharmacogenomics study of drug interactions with the genome or proteome; also called toxicogenomics\u003c/i\u003e", "to": "ent:drug_interactions"}, {"arrows": "to", "color": "#888888", "from": "ent:pharmacogenomics", "label": "studies", "title": "\u003cb\u003estudies\u003c/b\u003e\u003cbr\u003e\u003ci\u003epharmacogenomics study of drug interactions with the genome or proteome; also called toxicogenomics\u003c/i\u003e", "to": "ent:the_genome"}, {"arrows": "to", "color": "#888888", "from": "ent:pharmacogenomics", "label": "studies", "title": "\u003cb\u003estudies\u003c/b\u003e\u003cbr\u003e\u003ci\u003epharmacogenomics study of drug interactions with the genome or proteome; also called toxicogenomics\u003c/i\u003e", "to": "ent:the_proteome"}, {"arrows": "to", "color": "#888888", "from": "ent:pharmacogenomics", "label": "also called", "title": "\u003cb\u003ealso called\u003c/b\u003e\u003cbr\u003e\u003ci\u003epharmacogenomics study of drug interactions with the genome or proteome; also called toxicogenomics\u003c/i\u003e", "to": "ent:toxicogenomics"}, {"arrows": "to", "color": "#888888", "from": "ent:physical_map", "label": "represents distance", "title": "\u003cb\u003erepresents distance\u003c/b\u003e\u003cbr\u003e\u003ci\u003eA physical map is a representation of the physical distance, in nucleotides, between genes or genetic markers.\u003c/i\u003e", "to": "ent:in_nucleotides"}, {"arrows": "to", "color": "#888888", "from": "ent:physical_map", "label": "provides detail of", "title": "\u003cb\u003eprovides detail of\u003c/b\u003e\u003cbr\u003e\u003ci\u003eA physical map provides detail of the actual physical distance between genetic markers, as well as the number of nucleotides.\u003c/i\u003e", "to": "ent:the_actual_physical_distance_between_genetic_markers"}, {"arrows": "to", "color": "#888888", "from": "ent:physical_map", "label": "provides detail of", "title": "\u003cb\u003eprovides detail of\u003c/b\u003e\u003cbr\u003e\u003ci\u003eA physical map provides detail of the actual physical distance between genetic markers, as well as the number of nucleotides.\u003c/i\u003e", "to": "ent:the_number_of_nucleotides"}, {"arrows": "to", "color": "#888888", "from": "ent:physical_map", "label": "represents", "title": "\u003cb\u003erepresents\u003c/b\u003e\u003cbr\u003e\u003ci\u003ephysical map representation of the physical distance between genes or genetic markers\u003c/i\u003e", "to": "ent:the_physical_distance"}, {"arrows": "to", "color": "#888888", "from": "ent:physical_map", "label": "represents", "title": "\u003cb\u003erepresents\u003c/b\u003e\u003cbr\u003e\u003ci\u003ephysical map representation of the physical distance between genes or genetic markers\u003c/i\u003e", "to": "ent:genes"}, {"arrows": "to", "color": "#888888", "from": "ent:physical_map", "label": "represents", "title": "\u003cb\u003erepresents\u003c/b\u003e\u003cbr\u003e\u003ci\u003ephysical map representation of the physical distance between genes or genetic markers\u003c/i\u003e", "to": "ent:genetic_markers"}, {"arrows": "to", "color": "#888888", "from": "ent:physical_maps", "label": "present details of", "title": "\u003cb\u003epresent details of\u003c/b\u003e\u003cbr\u003e\u003ci\u003ePhysical maps present the intimate details of smaller chromosome regions (similar to a detailed road map).\u003c/i\u003e", "to": "ent:smaller_chromosome_regions"}, {"arrows": "to", "color": "#888888", "from": "ent:physical_maps", "label": "provide", "title": "\u003cb\u003eprovide\u003c/b\u003e\u003cbr\u003e\u003ci\u003eGenetic maps provide the outline and physical maps provide the details.\u003c/i\u003e", "to": "ent:details"}, {"arrows": "to", "color": "#888888", "from": "ent:pig_insulin", "label": "caused", "title": "\u003cb\u003ecaused\u003c/b\u003e\u003cbr\u003e\u003ci\u003ePreviously, it was only possible to treat diabetes with pig insulin, which caused allergic reactions in humans because of differences in the gene product.\u003c/i\u003e", "to": "ent:allergic_reactions"}, {"arrows": "to", "color": "#888888", "from": "ent:plants", "label": "received", "title": "\u003cb\u003ereceived\u003c/b\u003e\u003cbr\u003e\u003ci\u003eWe call plants that have received recombinant DNA from other species transgenic plants.\u003c/i\u003e", "to": "ent:recombinant_dna"}, {"arrows": "to", "color": "#888888", "from": "ent:plasmid", "label": "is", "title": "\u003cb\u003eis\u003c/b\u003e\u003cbr\u003e\u003ci\u003eA plasmid, or vector, is a small circular DNA molecule that replicates independently of the chromosomal DNA.\u003c/i\u003e", "to": "ent:a_small_circular_dna_molecule"}, {"arrows": "to", "color": "#888888", "from": "ent:plasmid", "label": "replicates", "title": "\u003cb\u003ereplicates\u003c/b\u003e\u003cbr\u003e\u003ci\u003eA plasmid, or vector, is a small circular DNA molecule that replicates independently of the chromosomal DNA.\u003c/i\u003e", "to": "ent:independently_of_the_chromosomal_dna"}, {"arrows": "to", "color": "#888888", "from": "ent:plasmid_vectors", "label": "have", "title": "\u003cb\u003ehave\u003c/b\u003e\u003cbr\u003e\u003ci\u003eAn important feature of plasmid vectors is the ease with which scientists can introduce a foreign DNA fragment via the multiple cloning site (MCS).\u003c/i\u003e", "to": "ent:multiple_cloning_site"}, {"arrows": "to", "color": "#888888", "from": "ent:plasmids", "label": "occur", "title": "\u003cb\u003eoccur\u003c/b\u003e\u003cbr\u003e\u003ci\u003ePlasmids occur naturally in bacterial populations (such as Escherichia coli) and have genes that can contribute favorable traits to the organism, such as antibiotic resistance (the ability to be unaffected by antibiotics).\u003c/i\u003e", "to": "ent:naturally_in_bacterial_populations"}, {"arrows": "to", "color": "#888888", "from": "ent:plasmids", "label": "have", "title": "\u003cb\u003ehave\u003c/b\u003e\u003cbr\u003e\u003ci\u003ePlasmids occur naturally in bacterial populations (such as Escherichia coli) and have genes that can contribute favorable traits to the organism, such as antibiotic resistance (the ability to be unaffected by antibiotics).\u003c/i\u003e", "to": "ent:genes_that_contribute_favorable_traits"}, {"arrows": "to", "color": "#888888", "from": "ent:plasmids", "label": "contain", "title": "\u003cb\u003econtain\u003c/b\u003e\u003cbr\u003e\u003ci\u003ePlasmids with foreign DNA inserted into them are called recombinant DNA molecules because they are created artificially and do not occur in nature.\u003c/i\u003e", "to": "ent:foreign_dna"}, {"arrows": "to", "color": "#888888", "from": "ent:polygenic", "label": "caused by", "title": "\u003cb\u003ecaused by\u003c/b\u003e\u003cbr\u003e\u003ci\u003epolygenic phenotypic characteristic caused by two or more genes\u003c/i\u003e", "to": "ent:two_or_more_genes"}, {"arrows": "to", "color": "#888888", "from": "ent:polygenic", "label": "involves", "title": "\u003cb\u003einvolves\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMost of the common diseases, such as heart disease, are multi-factored or polygenic, which is a phenotypic characteristic that involves two or more genes, and also involve environmental factors such as diet.\u003c/i\u003e", "to": "ent:environmental_factors"}, {"arrows": "to", "color": "#888888", "from": "ent:polygenic", "label": "causes", "title": "\u003cb\u003ecauses\u003c/b\u003e\u003cbr\u003e\u003ci\u003epolygenic phenotypic characteristic caused by two or more genes\u003c/i\u003e", "to": "ent:phenotypic_characteristic"}, {"arrows": "to", "color": "#888888", "from": "ent:polymerase_chain_reaction", "label": "amplify", "title": "\u003cb\u003eamplify\u003c/b\u003e\u003cbr\u003e\u003ci\u003eScientists use polymerase chain reaction, or PCR, to amplify a specific DNA sequence.\u003c/i\u003e", "to": "ent:a_specific_dna_sequence"}, {"arrows": "to", "color": "#888888", "from": "ent:polymerase_chain_reaction", "label": "technique to", "title": "\u003cb\u003etechnique to\u003c/b\u003e\u003cbr\u003e\u003ci\u003epolymerase chain reaction (PCR) technique to amplify DNA\u003c/i\u003e", "to": "ent:amplify_dna"}, {"arrows": "to", "color": "#888888", "from": "ent:predicting_disease_risk", "label": "involves", "title": "\u003cb\u003einvolves\u003c/b\u003e\u003cbr\u003e\u003ci\u003ePredicting disease risk involves screening currently healthy individuals by genome analysis at the individual level.\u003c/i\u003e", "to": "ent:genome_analysis_at_the_individual_level"}, {"arrows": "to", "color": "#888888", "from": "ent:predicting_disease_risk", "label": "is most applicable when", "title": "\u003cb\u003eis most applicable when\u003c/b\u003e\u003cbr\u003e\u003ci\u003eHowever, this approach is most applicable when the problem resides within a single gene defect.\u003c/i\u003e", "to": "ent:the_problem_resides_within_a_single_gene_defect"}, {"arrows": "to", "color": "#888888", "from": "ent:prey_protein", "label": "attaches to", "title": "\u003cb\u003eattaches to\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe bait protein attaches to the BD, and the prey protein attaches to the AD.\u003c/i\u003e", "to": "ent:ad"}, {"arrows": "to", "color": "#888888", "from": "ent:primers", "label": "combine with", "title": "\u003cb\u003ecombine with\u003c/b\u003e\u003cbr\u003e\u003ci\u003ePrimers\u2014short pieces of DNA complementary to each end of the target sequence combine with genomic DNA, Taq polymerase, and deoxynucleotides.\u003c/i\u003e", "to": "ent:genomic_dna"}, {"arrows": "to", "color": "#888888", "from": "ent:primers", "label": "combine with", "title": "\u003cb\u003ecombine with\u003c/b\u003e\u003cbr\u003e\u003ci\u003ePrimers\u2014short pieces of DNA complementary to each end of the target sequence combine with genomic DNA, Taq polymerase, and deoxynucleotides.\u003c/i\u003e", "to": "ent:taq_polymerase"}, {"arrows": "to", "color": "#888888", "from": "ent:primers", "label": "combine with", "title": "\u003cb\u003ecombine with\u003c/b\u003e\u003cbr\u003e\u003ci\u003ePrimers\u2014short pieces of DNA complementary to each end of the target sequence combine with genomic DNA, Taq polymerase, and deoxynucleotides.\u003c/i\u003e", "to": "ent:deoxynucleotides"}, {"arrows": "to", "color": "#888888", "from": "ent:probe", "label": "determines presence of", "title": "\u003cb\u003edetermines presence of\u003c/b\u003e\u003cbr\u003e\u003ci\u003eprobe small DNA fragment to determine if the complementary sequence is present in a DNA sample\u003c/i\u003e", "to": "ent:complementary_sequence"}, {"arrows": "to", "color": "#888888", "from": "ent:prostate_cancer", "label": "often develops", "title": "\u003cb\u003eoften develops\u003c/b\u003e\u003cbr\u003e\u003ci\u003eProstate cancer often develops very slowly and does not cause problems, while the cancer treatment can have severe side effects.\u003c/i\u003e", "to": "ent:very_slowly"}, {"arrows": "to", "color": "#888888", "from": "ent:protease", "label": "breaks down", "title": "\u003cb\u003ebreaks down\u003c/b\u003e\u003cbr\u003e\u003ci\u003eprotease enzyme that breaks down proteins\u003c/i\u003e", "to": "ent:proteins"}, {"arrows": "to", "color": "#888888", "from": "ent:proteases", "label": "break down", "title": "\u003cb\u003ebreak down\u003c/b\u003e\u003cbr\u003e\u003ci\u003eEnzymes such as proteases and ribonucleases (RNases) break down proteins and RNA, respectively.\u003c/i\u003e", "to": "ent:proteins"}, {"arrows": "to", "color": "#888888", "from": "ent:protein_microarrays", "label": "based on", "title": "\u003cb\u003ebased on\u003c/b\u003e\u003cbr\u003e\u003ci\u003eLarge-scale adaptations of the basic two-hybrid screen (Figure 17.17) have provided the basis for protein microarrays.\u003c/i\u003e", "to": "ent:large-scale_adaptations_of_the_basic_two-hybrid_screen"}, {"arrows": "to", "color": "#888888", "from": "ent:protein_signature", "label": "is set of", "title": "\u003cb\u003eis set of\u003c/b\u003e\u003cbr\u003e\u003ci\u003eprotein signature set of uniquely expressed proteins in the diseased state\u003c/i\u003e", "to": "ent:uniquely_expressed_proteins"}, {"arrows": "to", "color": "#888888", "from": "ent:protein_signatures", "label": "may be more reliable than", "title": "\u003cb\u003emay be more reliable than\u003c/b\u003e\u003cbr\u003e\u003ci\u003eProtein signatures may be more reliable than biomarkers to detect cancer cells.\u003c/i\u003e", "to": "ent:biomarkers"}, {"arrows": "to", "color": "#888888", "from": "ent:proteins", "label": "are expressed from", "title": "\u003cb\u003eare expressed from\u003c/b\u003e\u003cbr\u003e\u003ci\u003eWe call proteins that are expressed from recombinant DNA molecules recombinant proteins.\u003c/i\u003e", "to": "ent:recombinant_dna_molecules"}, {"arrows": "to", "color": "#888888", "from": "ent:proteins", "label": "direct products of", "title": "\u003cb\u003edirect products of\u003c/b\u003e\u003cbr\u003e\u003ci\u003eBecause proteins are the direct products of genes and reflect activity at the genomic level, it is natural to use proteomes to compare the protein profiles of different cells to identify proteins and genes involved in disease processes.\u003c/i\u003e", "to": "ent:genes"}, {"arrows": "to", "color": "#888888", "from": "ent:proteins", "label": "comprise", "title": "\u003cb\u003ecomprise\u003c/b\u003e\u003cbr\u003e\u003ci\u003eAmino acids comprise proteins and play important roles in the cell.\u003c/i\u003e", "to": "ent:amino_acids"}, {"arrows": "to", "color": "#888888", "from": "ent:proteins", "label": "act as", "title": "\u003cb\u003eact as\u003c/b\u003e\u003cbr\u003e\u003ci\u003eAll enzymes (except ribozymes) are proteins that act as catalysts to affect the rate of reactions.\u003c/i\u003e", "to": "ent:catalysts"}, {"arrows": "to", "color": "#888888", "from": "ent:proteins", "label": "are", "title": "\u003cb\u003eare\u003c/b\u003e\u003cbr\u003e\u003ci\u003eProteins are also regulatory molecules, and some are hormones.\u003c/i\u003e", "to": "ent:regulatory_molecules"}, {"arrows": "to", "color": "#888888", "from": "ent:proteins", "label": "are", "title": "\u003cb\u003eare\u003c/b\u003e\u003cbr\u003e\u003ci\u003eProteins are also regulatory molecules, and some are hormones.\u003c/i\u003e", "to": "ent:hormones"}, {"arrows": "to", "color": "#888888", "from": "ent:proteins", "label": "are", "title": "\u003cb\u003eare\u003c/b\u003e\u003cbr\u003e\u003ci\u003eProteins are naturally unstable molecules, which makes proteomic analysis much more difficult than genomic analysis.\u003c/i\u003e", "to": "ent:unstable_molecules"}, {"arrows": "to", "color": "#888888", "from": "ent:proteome", "label": "is", "title": "\u003cb\u003eis\u003c/b\u003e\u003cbr\u003e\u003ci\u003eA proteome is the entire set of proteins that a cell type produces.\u003c/i\u003e", "to": "ent:set_of_proteins"}, {"arrows": "to", "color": "#888888", "from": "ent:proteome", "label": "is set of", "title": "\u003cb\u003eis set of\u003c/b\u003e\u003cbr\u003e\u003ci\u003eproteome entire set of proteins that cell type produces\u003c/i\u003e", "to": "ent:proteins"}, {"arrows": "to", "color": "#888888", "from": "ent:proteomes", "label": "use to compare", "title": "\u003cb\u003euse to compare\u003c/b\u003e\u003cbr\u003e\u003ci\u003eBecause proteins are the direct products of genes and reflect activity at the genomic level, it is natural to use proteomes to compare the protein profiles of different cells to identify proteins and genes involved in disease processes.\u003c/i\u003e", "to": "ent:protein_profiles_of_different_cells"}, {"arrows": "to", "color": "#888888", "from": "ent:proteomic_approaches", "label": "improve", "title": "\u003cb\u003eimprove\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThese approaches improve screening and early cancer detection.\u003c/i\u003e", "to": "ent:screening_and_early_cancer_detection"}, {"arrows": "to", "color": "#888888", "from": "ent:proteomics", "label": "studies", "title": "\u003cb\u003estudies\u003c/b\u003e\u003cbr\u003e\u003ci\u003eProteomics is the study of proteomes\u0027 function.\u003c/i\u003e", "to": "ent:proteomes\u0027_function"}, {"arrows": "to", "color": "#888888", "from": "ent:proteomics", "label": "complements", "title": "\u003cb\u003ecomplements\u003c/b\u003e\u003cbr\u003e\u003ci\u003eProteomics complements genomics and is useful when scientists want to test their hypotheses that they based on genes.\u003c/i\u003e", "to": "ent:genomics"}, {"arrows": "to", "color": "#888888", "from": "ent:proteomics", "label": "requires", "title": "\u003cb\u003erequires\u003c/b\u003e\u003cbr\u003e\u003ci\u003eJust as scientists analyze the genome using the basic DNA sequencing technique, proteomics requires techniques for protein analysis.\u003c/i\u003e", "to": "ent:techniques_for_protein_analysis"}, {"arrows": "to", "color": "#888888", "from": "ent:proteomics", "label": "is the study of", "title": "\u003cb\u003eis the study of\u003c/b\u003e\u003cbr\u003e\u003ci\u003eProteomics is the study of the entire set of proteins expressed by a given type of cell under certain environmental conditions.\u003c/i\u003e", "to": "ent:the_entire_set_of_proteins_expressed_by_a_given_type_of_cell_under_certain_environmental_conditions"}, {"arrows": "to", "color": "#888888", "from": "ent:proteomics", "label": "used in", "title": "\u003cb\u003eused in\u003c/b\u003e\u003cbr\u003e\u003ci\u003eHow has proteomics been used in cancer detection and treatment?\u003c/i\u003e", "to": "ent:cancer_detection_and_treatment"}, {"arrows": "to", "color": "#888888", "from": "ent:proteomics_approaches", "label": "rely on", "title": "\u003cb\u003erely on\u003c/b\u003e\u003cbr\u003e\u003ci\u003eProteomics approaches rely on protein analysis.\u003c/i\u003e", "to": "ent:protein_analysis"}, {"arrows": "to", "color": "#888888", "from": "ent:psa", "label": "is example of", "title": "\u003cb\u003eis example of\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSome examples of protein biomarkers in cancer detection are CA-125 for ovarian cancer and PSA for prostate cancer.\u003c/i\u003e", "to": "ent:protein_biomarkers_in_cancer_detection"}, {"arrows": "to", "color": "#888888", "from": "ent:psa_test", "label": "measures the level of", "title": "\u003cb\u003emeasures the level of\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe PCA3 test is a better indicator of cancer than the more well known PSA test, which measures the level of PSA (prostate-specific antigen) in the blood.\u003c/i\u003e", "to": "ent:psa_(prostate-specific_antigen)"}, {"arrows": "to", "color": "#888888", "from": "ent:pure_culture", "label": "involves isolating", "title": "\u003cb\u003einvolves isolating\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThis involves isolating a single cell type and culturing it in the laboratory.\u003c/i\u003e", "to": "ent:a_single_cell_type"}, {"arrows": "to", "color": "#888888", "from": "ent:pure_culture", "label": "is growth of", "title": "\u003cb\u003eis growth of\u003c/b\u003e\u003cbr\u003e\u003ci\u003epure culture growth of a single cell type in the laboratory\u003c/i\u003e", "to": "ent:single_cell_type"}, {"arrows": "to", "color": "#888888", "from": "ent:radiation_hybrid_mapping", "label": "uses", "title": "\u003cb\u003euses\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRadiation hybrid mapping uses radiation, such as x-rays, to break the DNA into fragments.\u003c/i\u003e", "to": "ent:radiation"}, {"arrows": "to", "color": "#888888", "from": "ent:radiation_hybrid_mapping", "label": "overcomes the limitation of", "title": "\u003cb\u003eovercomes the limitation of\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThis technique overcomes the limitation of genetic mapping, and we can adjust the radiation so that increased or decreased recombination frequency does not affect it.\u003c/i\u003e", "to": "ent:genetic_mapping"}, {"arrows": "to", "color": "#888888", "from": "ent:radiation_hybrid_mapping", "label": "obtained by", "title": "\u003cb\u003eobtained by\u003c/b\u003e\u003cbr\u003e\u003ci\u003eradiation hybrid mapping information obtained by fragmenting the chromosome with x-rays\u003c/i\u003e", "to": "ent:fragmenting_the_chromosome_with_x-rays"}, {"arrows": "to", "color": "#888888", "from": "ent:recombinant_dna", "label": "may need to move into", "title": "\u003cb\u003emay need to move into\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe recombinant DNA may need to move into a different vector (or host) that is better designed for gene expression.\u003c/i\u003e", "to": "ent:a_different_vector"}, {"arrows": "to", "color": "#888888", "from": "ent:recombinant_dna", "label": "combines", "title": "\u003cb\u003ecombines\u003c/b\u003e\u003cbr\u003e\u003ci\u003erecombinant DNA combining DNA fragments that molecular cloning generates that do not exist in nature; also a chimeric molecule\u003c/i\u003e", "to": "ent:dna_fragments"}, {"arrows": "to", "color": "#888888", "from": "ent:recombinant_dna_molecules", "label": "are called", "title": "\u003cb\u003eare called\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThey are also called chimeric molecules because the origin of different molecule parts of the molecules can be traced back to different species of biological organisms or even to chemical synthesis.\u003c/i\u003e", "to": "ent:chimeric_molecules"}, {"arrows": "to", "color": "#888888", "from": "ent:recombinant_dna_technology", "label": "produced", "title": "\u003cb\u003eproduced\u003c/b\u003e\u003cbr\u003e\u003ci\u003eScientists used recombinant DNA technology to produce large-scale quantities of human insulin in E. coli as early as 1978.\u003c/i\u003e", "to": "ent:human_insulin"}, {"arrows": "to", "color": "#888888", "from": "ent:recombinant_dna_vectors", "label": "generated by", "title": "\u003cb\u003egenerated by\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe addition of foreign DNA in the form of recombinant DNA vectors generated by molecular cloning is the most common method of genetic engineering.\u003c/i\u003e", "to": "ent:molecular_cloning"}, {"arrows": "to", "color": "#888888", "from": "ent:recombinant_protein", "label": "is product of", "title": "\u003cb\u003eis product of\u003c/b\u003e\u003cbr\u003e\u003ci\u003erecombinant protein a gene\u0027s protein product derived by molecular cloning\u003c/i\u003e", "to": "ent:gene"}, {"arrows": "to", "color": "#888888", "from": "ent:recombination_frequency_between_two_genes", "label": "is less than 50 percent", "title": "\u003cb\u003eis less than 50 percent\u003c/b\u003e\u003cbr\u003e\u003ci\u003eIf the recombination frequency between two genes is less than 50 percent, they are linked.\u003c/i\u003e", "to": "ent:they_are_linked"}, {"arrows": "to", "color": "#888888", "from": "ent:recombination_level", "label": "affects", "title": "\u003cb\u003eaffects\u003c/b\u003e\u003cbr\u003e\u003ci\u003eBecause genetic maps rely completely on the natural process of recombination, natural increases or decreases in the recombination level of a given genome area affects mapping.\u003c/i\u003e", "to": "ent:mapping"}, {"arrows": "to", "color": "#888888", "from": "ent:reproductive_cloning", "label": "is a method", "title": "\u003cb\u003eis a method\u003c/b\u003e\u003cbr\u003e\u003ci\u003eReproductive cloning is a method scientists use to clone or identically copy an entire multicellular organism.\u003c/i\u003e", "to": "ent:to_clone_an_organism"}, {"arrows": "to", "color": "#888888", "from": "ent:reproductive_cloning", "label": "clones", "title": "\u003cb\u003eclones\u003c/b\u003e\u003cbr\u003e\u003ci\u003ereproductive cloning entire organism cloning\u003c/i\u003e", "to": "ent:entire_organism"}, {"arrows": "to", "color": "#888888", "from": "ent:research_involving_plant_genome_mapping", "label": "lead to", "title": "\u003cb\u003elead to\u003c/b\u003e\u003cbr\u003e\u003ci\u003eResearch involving plant genome mapping may lead to producing higher crop yields or developing plants that better adapt to climate change.\u003c/i\u003e", "to": "ent:producing_higher_crop_yields"}, {"arrows": "to", "color": "#888888", "from": "ent:research_involving_plant_genome_mapping", "label": "lead to", "title": "\u003cb\u003elead to\u003c/b\u003e\u003cbr\u003e\u003ci\u003eResearch involving plant genome mapping may lead to producing higher crop yields or developing plants that better adapt to climate change.\u003c/i\u003e", "to": "ent:developing_plants_that_better_adapt_to_climate_change"}, {"arrows": "to", "color": "#888888", "from": "ent:researcher", "label": "study", "title": "\u003cb\u003estudy\u003c/b\u003e\u003cbr\u003e\u003ci\u003eA researcher wants to study cancer cells from a patient with breast cancer.\u003c/i\u003e", "to": "ent:cancer_cells"}, {"arrows": "to", "color": "#888888", "from": "ent:researchers", "label": "analyze", "title": "\u003cb\u003eanalyze\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe most common type of RNA that researchers analyze is the messenger RNA (mRNA) because it represents the protein-coding genes that are actively expressed.\u003c/i\u003e", "to": "ent:messenger_rna"}, {"arrows": "to", "color": "#888888", "from": "ent:researchers", "label": "use techniques to extract", "title": "\u003cb\u003euse techniques to extract\u003c/b\u003e\u003cbr\u003e\u003ci\u003eTo study or manipulate nucleic acids, one must first isolate or extract the DNA or RNA from the cells. Researchers use various techniques to extract different types of DNA (Figure 17.3).\u003c/i\u003e", "to": "ent:dna"}, {"arrows": "to", "color": "#888888", "from": "ent:researchers", "label": "run", "title": "\u003cb\u003erun\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThere are molecular weight standard samples that researchers can run alongside the molecules to provide a size comparison.\u003c/i\u003e", "to": "ent:molecular_weight_standard_samples"}, {"arrows": "to", "color": "#888888", "from": "ent:researchers", "label": "use PCR for", "title": "\u003cb\u003euse PCR for\u003c/b\u003e\u003cbr\u003e\u003ci\u003eResearchers use PCR for many purposes in laboratories, such as cloning gene fragments to analyze genetic diseases, identifying contaminant foreign DNA in a sample, and amplifying DNA for sequencing.\u003c/i\u003e", "to": "ent:cloning_gene_fragments"}, {"arrows": "to", "color": "#888888", "from": "ent:researchers", "label": "use PCR for", "title": "\u003cb\u003euse PCR for\u003c/b\u003e\u003cbr\u003e\u003ci\u003eResearchers use PCR for many purposes in laboratories, such as cloning gene fragments to analyze genetic diseases, identifying contaminant foreign DNA in a sample, and amplifying DNA for sequencing.\u003c/i\u003e", "to": "ent:identifying_contaminant_foreign_dna"}, {"arrows": "to", "color": "#888888", "from": "ent:researchers", "label": "use PCR for", "title": "\u003cb\u003euse PCR for\u003c/b\u003e\u003cbr\u003e\u003ci\u003eResearchers use PCR for many purposes in laboratories, such as cloning gene fragments to analyze genetic diseases, identifying contaminant foreign DNA in a sample, and amplifying DNA for sequencing.\u003c/i\u003e", "to": "ent:amplifying_dna_for_sequencing"}, {"arrows": "to", "color": "#888888", "from": "ent:researchers", "label": "cloned", "title": "\u003cb\u003ecloned\u003c/b\u003e\u003cbr\u003e\u003ci\u003eResearchers cloned the HGH gene from a cDNA library and inserted it into E. coli cells by cloning it into a bacterial vector.\u003c/i\u003e", "to": "ent:hgh_gene"}, {"arrows": "to", "color": "#888888", "from": "ent:researchers", "label": "use natural transfer", "title": "\u003cb\u003euse natural transfer\u003c/b\u003e\u003cbr\u003e\u003ci\u003eResearchers used the natural transfer of DNA from Agrobacterium to a plant host to introduce DNA fragments of their choice into plant hosts.\u003c/i\u003e", "to": "ent:dna_from_agrobacterium_to_plant_host"}, {"arrows": "to", "color": "#888888", "from": "ent:researchers", "label": "manipulate Ti plasmids", "title": "\u003cb\u003emanipulate Ti plasmids\u003c/b\u003e\u003cbr\u003e\u003ci\u003eResearchers manipulate the Ti plasmids to remove the tumor-causing genes and insert the desired DNA fragment for transfer into the plant genome.\u003c/i\u003e", "to": "ent:remove_tumor-causing_genes"}, {"arrows": "to", "color": "#888888", "from": "ent:researchers", "label": "study", "title": "\u003cb\u003estudy\u003c/b\u003e\u003cbr\u003e\u003ci\u003eHaving a complete genome map of the genome makes it easier for researchers to study individual genes.\u003c/i\u003e", "to": "ent:individual_genes"}, {"arrows": "to", "color": "#888888", "from": "ent:researchers", "label": "use information from", "title": "\u003cb\u003euse information from\u003c/b\u003e\u003cbr\u003e\u003ci\u003eResearchers use information that they obtain from proteomics to identify novel drugs and to understand their mechanisms of action.\u003c/i\u003e", "to": "ent:proteomics"}, {"arrows": "to", "color": "#888888", "from": "ent:researchers", "label": "identify", "title": "\u003cb\u003eidentify\u003c/b\u003e\u003cbr\u003e\u003ci\u003eResearchers use information that they obtain from proteomics to identify novel drugs and to understand their mechanisms of action.\u003c/i\u003e", "to": "ent:novel_drugs"}, {"arrows": "to", "color": "#888888", "from": "ent:researchers", "label": "understand", "title": "\u003cb\u003eunderstand\u003c/b\u003e\u003cbr\u003e\u003ci\u003eResearchers use information that they obtain from proteomics to identify novel drugs and to understand their mechanisms of action.\u003c/i\u003e", "to": "ent:mechanisms_of_action"}, {"arrows": "to", "color": "#888888", "from": "ent:researchers", "label": "study", "title": "\u003cb\u003estudy\u003c/b\u003e\u003cbr\u003e\u003ci\u003eResearchers are studying patients\u0027 genomes and proteomes to understand the genetic basis of diseases.\u003c/i\u003e", "to": "ent:patients\u0027_genomes_and_proteomes"}, {"arrows": "to", "color": "#888888", "from": "ent:researchers", "label": "study", "title": "\u003cb\u003estudy\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThe most prominent disease researchers are studying with proteomic approaches is cancer.\u003c/i\u003e", "to": "ent:cancer"}, {"arrows": "to", "color": "#888888", "from": "ent:researchers", "label": "identify", "title": "\u003cb\u003eidentify\u003c/b\u003e\u003cbr\u003e\u003ci\u003eResearchers are able to identify proteins whose expression indicates the disease process.\u003c/i\u003e", "to": "ent:proteins_whose_expression_indicates_the_disease_process"}, {"arrows": "to", "color": "#888888", "from": "ent:researchers", "label": "use proteomics to develop", "title": "\u003cb\u003euse proteomics to develop\u003c/b\u003e\u003cbr\u003e\u003ci\u003eResearchers are also using proteomics to develop individualized treatment plans, which involves predicting whether or not an individual will respond to specific drugs and the side effects that the individual may experience.\u003c/i\u003e", "to": "ent:individualized_treatment_plans"}, {"arrows": "to", "color": "#888888", "from": "ent:researchers", "label": "use proteomics to predict", "title": "\u003cb\u003euse proteomics to predict\u003c/b\u003e\u003cbr\u003e\u003ci\u003eResearchers also use proteomics to predict the possibility of disease recurrence.\u003c/i\u003e", "to": "ent:possibility_of_disease_recurrence"}, {"arrows": "to", "color": "#888888", "from": "ent:researchers", "label": "can use", "title": "\u003cb\u003ecan use\u003c/b\u003e\u003cbr\u003e\u003ci\u003eResearchers can use Southern and Northern blotting to detect the presence of specific short sequences in a DNA or RNA sample.\u003c/i\u003e", "to": "ent:southern_and_northern_blotting"}, {"arrows": "to", "color": "#888888", "from": "ent:researchers", "label": "combine information", "title": "\u003cb\u003ecombine information\u003c/b\u003e\u003cbr\u003e\u003ci\u003eResearchers combine information from all mapping and sequencing sources to study an entire genome.\u003c/i\u003e", "to": "ent:mapping_and_sequencing_sources"}, {"arrows": "to", "color": "#888888", "from": "ent:researchers", "label": "use", "title": "\u003cb\u003euse\u003c/b\u003e\u003cbr\u003e\u003ci\u003eresearchers use whole-genome sequences of model organisms to better understand the species\u0027 genome.\u003c/i\u003e", "to": "ent:whole-genome_sequences_of_model_organisms"}, {"arrows": "to", "color": "#888888", "from": "ent:researchers", "label": "apply", "title": "\u003cb\u003eapply\u003c/b\u003e\u003cbr\u003e\u003ci\u003eResearchers are applying genomics to most fields of biology.\u003c/i\u003e", "to": "ent:genomics"}, {"arrows": "to", "color": "#888888", "from": "ent:researchers", "label": "use genomics for", "title": "\u003cb\u003euse genomics for\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThey use it for personalized medicine, prediction of disease risks at an individual level, studying drug interactions before conducting clinical trials, and studying microorganisms in the environment as opposed to the laboratory.\u003c/i\u003e", "to": "ent:personalized_medicine"}, {"arrows": "to", "color": "#888888", "from": "ent:researchers", "label": "use genomics for", "title": "\u003cb\u003euse genomics for\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThey use it for personalized medicine, prediction of disease risks at an individual level, studying drug interactions before conducting clinical trials, and studying microorganisms in the environment as opposed to the laboratory.\u003c/i\u003e", "to": "ent:prediction_of_disease_risks_at_an_individual_level"}, {"arrows": "to", "color": "#888888", "from": "ent:researchers", "label": "use genomics for", "title": "\u003cb\u003euse genomics for\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThey use it for personalized medicine, prediction of disease risks at an individual level, studying drug interactions before conducting clinical trials, and studying microorganisms in the environment as opposed to the laboratory.\u003c/i\u003e", "to": "ent:studying_drug_interactions"}, {"arrows": "to", "color": "#888888", "from": "ent:researchers", "label": "use genomics for", "title": "\u003cb\u003euse genomics for\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThey use it for personalized medicine, prediction of disease risks at an individual level, studying drug interactions before conducting clinical trials, and studying microorganisms in the environment as opposed to the laboratory.\u003c/i\u003e", "to": "ent:studying_microorganisms_in_the_environment"}, {"arrows": "to", "color": "#888888", "from": "ent:researchers", "label": "apply genomics to", "title": "\u003cb\u003eapply genomics to\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThey are also applying it to developments such as generating new biofuels, genealogical assessment using mitochondria, advances in forensic science, and improvements in agriculture.\u003c/i\u003e", "to": "ent:generating_new_biofuels"}, {"arrows": "to", "color": "#888888", "from": "ent:researchers", "label": "apply genomics to", "title": "\u003cb\u003eapply genomics to\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThey are also applying it to developments such as generating new biofuels, genealogical assessment using mitochondria, advances in forensic science, and improvements in agriculture.\u003c/i\u003e", "to": "ent:genealogical_assessment_using_mitochondria"}, {"arrows": "to", "color": "#888888", "from": "ent:researchers", "label": "apply genomics to", "title": "\u003cb\u003eapply genomics to\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThey are also applying it to developments such as generating new biofuels, genealogical assessment using mitochondria, advances in forensic science, and improvements in agriculture.\u003c/i\u003e", "to": "ent:advances_in_forensic_science"}, {"arrows": "to", "color": "#888888", "from": "ent:researchers", "label": "apply genomics to", "title": "\u003cb\u003eapply genomics to\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThey are also applying it to developments such as generating new biofuels, genealogical assessment using mitochondria, advances in forensic science, and improvements in agriculture.\u003c/i\u003e", "to": "ent:improvements_in_agriculture"}, {"arrows": "to", "color": "#888888", "from": "ent:researchers", "label": "upgrade", "title": "\u003cb\u003eupgrade\u003c/b\u003e\u003cbr\u003e\u003ci\u003eResearchers are constantly upgrading these techniques.\u003c/i\u003e", "to": "ent:proteomics_techniques"}, {"arrows": "to", "color": "#888888", "from": "ent:researchers", "label": "use proteomics to study", "title": "\u003cb\u003euse proteomics to study\u003c/b\u003e\u003cbr\u003e\u003ci\u003eResearchers have used proteomics to study different cancer types.\u003c/i\u003e", "to": "ent:different_cancer_types"}, {"arrows": "to", "color": "#888888", "from": "ent:researchers", "label": "left genomic DNA", "title": "\u003cb\u003eleft genomic DNA\u003c/b\u003e\u003cbr\u003e\u003ci\u003eYour lab partner left the foreign genomic DNA that you are planning to clone on the lab bench overnight instead of storing it in the freezer.\u003c/i\u003e", "to": "ent:lab_bench"}, {"arrows": "to", "color": "#888888", "from": "ent:restriction_endonuclease", "label": "recognizes", "title": "\u003cb\u003erecognizes\u003c/b\u003e\u003cbr\u003e\u003ci\u003eWe can detect RFLPs (sometimes pronounced \u201crif-lips\u201d) when the DNA of an individual is cut with a restriction endonuclease that recognizes specific sequences in the DNA to generate a series of DNA fragments, which we can then analyze using gel electrophoresis.\u003c/i\u003e", "to": "ent:specific_sequences_in_the_dna"}, {"arrows": "to", "color": "#888888", "from": "ent:restriction_endonuclease", "label": "recognizes and cleaves", "title": "\u003cb\u003erecognizes and cleaves\u003c/b\u003e\u003cbr\u003e\u003ci\u003erestriction endonuclease enzyme that can recognize and cleave specific DNA sequences\u003c/i\u003e", "to": "ent:specific_dna_sequences"}, {"arrows": "to", "color": "#888888", "from": "ent:restriction_endonucleases", "label": "recognize", "title": "\u003cb\u003erecognize\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRestriction endonucleases recognize specific DNA sequences and cut them in a predictable manner.\u003c/i\u003e", "to": "ent:specific_dna_sequences"}, {"arrows": "to", "color": "#888888", "from": "ent:restriction_endonucleases", "label": "cut", "title": "\u003cb\u003ecut\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRestriction endonucleases recognize specific DNA sequences and cut them in a predictable manner.\u003c/i\u003e", "to": "ent:dna_sequences"}, {"arrows": "to", "color": "#888888", "from": "ent:restriction_endonucleases", "label": "make", "title": "\u003cb\u003emake\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMany restriction endonucleases make staggered cuts in the two DNA strands, such that the cut ends have a 2- or 4-base single-stranded overhang.\u003c/i\u003e", "to": "ent:staggered_cuts"}, {"arrows": "to", "color": "#888888", "from": "ent:restriction_fragment_length_polymorphism_(rflp)", "label": "is variation in", "title": "\u003cb\u003eis variation in\u003c/b\u003e\u003cbr\u003e\u003ci\u003erestriction fragment length polymorphism (RFLP) variation between individuals in the length of DNA fragments, which restriction endonucleases generate\u003c/i\u003e", "to": "ent:length_of_dna_fragments"}, {"arrows": "to", "color": "#888888", "from": "ent:reverse_genetics", "label": "resulted in reversing", "title": "\u003cb\u003eresulted in reversing\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThis technique, reverse genetics, has resulted in reversing the classic genetic methodology.\u003c/i\u003e", "to": "ent:classic_genetic_methodology"}, {"arrows": "to", "color": "#888888", "from": "ent:reverse_genetics", "label": "determines", "title": "\u003cb\u003edetermines\u003c/b\u003e\u003cbr\u003e\u003ci\u003ereverse genetics method of determining the gene\u0027s function by starting with the gene itself instead of starting with the gene product\u003c/i\u003e", "to": "ent:gene\u0027s_function"}, {"arrows": "to", "color": "#888888", "from": "ent:reverse_transcriptase_pcr", "label": "similar to", "title": "\u003cb\u003esimilar to\u003c/b\u003e\u003cbr\u003e\u003ci\u003eReverse transcriptase PCR (RT-PCR) is similar to PCR, but cDNA is made from an RNA template before PCR begins.\u003c/i\u003e", "to": "ent:pcr"}, {"arrows": "to", "color": "#888888", "from": "ent:reverse_transcriptase_pcr", "label": "amplify", "title": "\u003cb\u003eamplify\u003c/b\u003e\u003cbr\u003e\u003ci\u003eDNA fragments can also be amplified from an RNA template in a process called reverse transcriptase PCR (RT-PCR).\u003c/i\u003e", "to": "ent:dna_fragments"}, {"arrows": "to", "color": "#888888", "from": "ent:reverse_transcriptase_pcr", "label": "use", "title": "\u003cb\u003euse\u003c/b\u003e\u003cbr\u003e\u003ci\u003eReverse transcriptase PCR (RT-PCR) is similar to PCR, but cDNA is made from an RNA template before PCR begins.\u003c/i\u003e", "to": "ent:cdna"}, {"arrows": "to", "color": "#888888", "from": "ent:reverse_transcriptase_pcr_(rt-pcr)", "label": "involves", "title": "\u003cb\u003einvolves\u003c/b\u003e\u003cbr\u003e\u003ci\u003ereverse transcriptase PCR (RT-PCR) PCR technique that involves converting RNA to DNA by reverse transcriptase\u003c/i\u003e", "to": "ent:converting_rna_to_dna"}, {"arrows": "to", "color": "#888888", "from": "ent:reverse_transcription", "label": "require", "title": "\u003cb\u003erequire\u003c/b\u003e\u003cbr\u003e\u003ci\u003eThis process is called reverse transcription. This requires the presence of an enzyme called reverse transcriptase.\u003c/i\u003e", "to": "ent:reverse_transcriptase"}, {"arrows": "to", "color": "#888888", "from": "ent:rflps", "label": "are detected when", "title": "\u003cb\u003eare detected when\u003c/b\u003e\u003cbr\u003e\u003ci\u003eWe can detect RFLPs (sometimes pronounced \u201crif-lips\u201d) when the DNA of an individual is cut with a restriction endonuclease that recognizes specific sequences in the DNA to generate a series of DNA fragments, which we can then analyze using gel electrophoresis.\u003c/i\u003e", "to": "ent:dna_is_cut_with_a_restriction_endonuclease"}, {"arrows": "to", "color": "#888888", "from": "ent:ribonuclease", "label": "breaks down", "title": "\u003cb\u003ebreaks down\u003c/b\u003e\u003cbr\u003e\u003ci\u003eribonuclease enzyme that breaks down RNA\u003c/i\u003e", "to": "ent:rna"}, {"arrows": "to", "color": "#888888", "from": "ent:ribonucleases", "label": "break down", "title": "\u003cb\u003ebreak down\u003c/b\u003e\u003cbr\u003e\u003ci\u003eEnzymes such as proteases and ribonucleases (RNases) break down proteins and RNA, respectively.\u003c/i\u003e", "to": "ent:rna"}, {"arrows": "to", "color": "#888888", "from": "ent:rna", "label": "leave", "title": "\u003cb\u003eleave\u003c/b\u003e\u003cbr\u003e\u003ci\u003eUnlike DNA, which is located in the eukaryotic cells\u0027 nucleus, RNA molecules leave the nucleus.\u003c/i\u003e", "to": "ent:nucleus"}, {"arrows": "to", "color": "#888888", "from": "ent:rna", "label": "are less stable than", "title": "\u003cb\u003eare less stable than\u003c/b\u003e\u003cbr\u003e\u003ci\u003eHowever, RNA molecules present some other challenges to analysis, as they are often less stable than DNA.\u003c/i\u003e", "to": "ent:dna"}, {"arrows": "to", "color": "#888888", "from": "ent:rna", "label": "is", "title": "\u003cb\u003eis\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRNA is naturally very unstable because RNases are commonly present in nature and very difficult to inactivate.\u003c/i\u003e", "to": "ent:unstable"}, {"arrows": "to", "color": "#888888", "from": "ent:rna_extraction", "label": "involves", "title": "\u003cb\u003einvolves\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSimilar to DNA, RNA extraction involves using various buffers and enzymes to inactivate macromolecules and preserve the RNA.\u003c/i\u003e", "to": "ent:buffers_and_enzymes"}, {"arrows": "to", "color": "#888888", "from": "ent:scientist", "label": "introduce", "title": "\u003cb\u003eintroduce\u003c/b\u003e\u003cbr\u003e\u003ci\u003eHow would a scientist introduce a gene for herbicide resistance into a plant?\u003c/i\u003e",
